[localizations]
default = "en"
supported = ["en", "zh"]

[localizations.translation]
en = "English"
zh = "简体中文"

[version]
major = 0
minor = 21
patch = 0
# pre_label = "alpha"
# pre_num = 0
build = 35
data_schema = 2

[data_schema]
resource_root = "efa/v2"

[download]
# Lazy-download classification for generated snapshots; bound to the
# generator, not to individual resource descriptors. Omitted `lazy_prefixes`
# derives from the effective `[resolution]` vocabulary (see
# efa.config.example.toml). Do not set it explicitly.

[resolution]
# Shared resource-resolution vocabulary between the app and the data
# pipeline. All keys have built-in defaults (see efa.config.example.toml);
# override only together with the corresponding app/pipeline changes.

[paths]
log = "data/log"

[resources.example]
descriptor = "data/resources/example/descriptor.toml"

[resources.tranquility]
descriptor = "data/resources/tranquility/descriptor.toml"

[resources.serenity]
descriptor = "data/resources/serenity/descriptor.toml"

[resources.singularity]
descriptor = "data/resources/singularity/descriptor.toml"
