[localizations]
default = "en"
supported = ["en", "zh"]

[localizations.translation]
en = "English"
zh = "简体中文"

[version]
# Shared build number (Flutter/Android versionCode); strictly increases
# across every release-triggering merge on both tracks.
# Jumped 37 -> 5000 at 1.0.0-beta.3: pre-beta.3 ABI-split APKs carried Flutter's
# per-ABI versionCode offset (armv7=1xxx, arm64=2xxx, x64=4xxx), so builds up to
# beta.2 sit at effective codes up to 4037. The jump keeps every new artifact
# strictly ahead of every legacy one; the offset itself is disabled via
# force-version-code-ignoring-abi in android/gradle.properties.
build = 5000
data_schema = 2

[version.testing]
# Testing track renders as major.minor.patch-beta.num+build.
# num = 0 is the ceremonial "rebased, not yet cut" state; never publish it.
major = 1
minor = 0
patch = 0
num = 2

[version.stable]
# Stable track renders as major.minor.patch+build.
# major.minor changes only via ship commits; patch only via backports.
major = 0
minor = 21
patch = 0

[data_schema]
resource_root = "efa/v2"

[paths]
log = "data/log"

[resources.example]
descriptor = "data/resources/example/descriptor.toml"

[resources.tranquility]
descriptor = "data/resources/tranquility/descriptor.toml"

[resources.serenity]
descriptor = "data/resources/serenity/descriptor.toml"

[resources.singularity]
descriptor = "data/resources/singularity/descriptor.toml"
