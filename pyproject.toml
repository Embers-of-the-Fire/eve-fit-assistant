[project]
name = "eve-fit-assistant"
version = "0.2.0-alpha.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.2",
    "colorama>=0.4.6",
    "python-dotenv>=1.2.2",
    "convert",
    "pydantic>=2.13.2",
    "aiohttp>=3.13.5",
    "aiofiles>=25.1.0",
    "tenacity>=9.1.4",
    "watchfiles>=1.1.1",
    "case-converter>=1.2.0",
    "tqdm>=4.67.0",
    "canonicaljson>=2.0.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["bootstrap/tests"]
pythonpath = [".", "bootstrap/data/schema"]
asyncio_mode = "auto"
addopts = ["--disable-socket", "--allow-unix-socket"]

[tool.uv.sources]
convert = { workspace = true }

[tool.uv.workspace]
members = ["rust/lib/eve-fit-os"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bootstrap*"]
