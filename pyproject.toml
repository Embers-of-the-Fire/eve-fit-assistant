[project]
name = "eve-fit-assistant"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15.2"
dependencies = [
    # Floor pin: 2026.10.23 restores the emSign roots removed from the Mozilla
    # bundle; older certifi breaks TLS to endpoints chaining to emSign CAs.
    "certifi>=2026.10.23",
    "click>=8.5.0",
    "colorama>=0.4.6",
    "python-dotenv>=1.2.4",
    "convert",
    "pydantic>=2.14.2",
    "aiohttp>=3.14.5",
    "aiofiles>=25.1.0",
    "tenacity>=9.2.1",
    "watchfiles>=1.3.0",
    "case-converter>=1.2.0",
    "tqdm>=4.70.1",
    "canonicaljson>=2.0.0",
    "requests>=2.34.2",
    "websockets>=17.3",
    "python-frontmatter>=1.3.0",
    "protobuf>=7.36.2",
    "pillow>=13.0.0",
    "boto3>=1.43.122",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["bootstrap/tests"]
pythonpath = [".", "bootstrap/data/schema"]
asyncio_mode = "auto"
addopts = ["--disable-socket", "--allow-unix-socket"]

[tool.uv.sources]
convert = { workspace = true }

[tool.uv.workspace]
members = ["packages/eve-fit-os"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bootstrap*"]
