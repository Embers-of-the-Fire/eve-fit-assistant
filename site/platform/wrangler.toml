name = "efa-platform"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

preview_urls = true

[[services]]
binding = "PLATFORM_API"
service = "efa-platform-api"

[[routes]]
pattern = "platform.efa-tech.dev"
custom_domain = true

# Legacy fit-link host. Cloudflare Bulk Redirects (account-level, managed
# outside this repo) permanently redirect /fit/raw to
# https://platform.efa-tech.dev/share/fit/raw; this Worker stays attached to
# the host to keep serving /.well-known/assetlinks.json for Android App Links
# verification of older app versions.
[[routes]]
pattern = "share.platform.efa-tech.dev"
custom_domain = true

# Preview chain: the platform API binding targets the preview environment
# (disposable efa-platform-test data).
[env.preview]

[[env.preview.services]]
binding = "PLATFORM_API"
service = "efa-platform-api"
environment = "preview"
