name = "efa-platform"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

preview_urls = true

[[services]]
binding = "PLATFORM_API"
service = "efa-platform-api"

[[routes]]
pattern = "platform.efa-tech.dev/*"
zone_name = "efa-tech.dev"

# Preview chain (docs/temp/api-unit/spec.md §4.4): the platform API binding
# targets the preview environment (disposable efa-platform-test data).
[env.preview]

[[env.preview.services]]
binding = "PLATFORM_API"
service = "efa-platform-api"
environment = "preview"
