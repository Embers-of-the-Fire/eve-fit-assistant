[changelog]
header = """\
# Changelog

All notable changes to EVE Fit Assistant are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/).
"""
body = """\
## [{{ version | trim_start_matches(pat="releases/") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}
{%- endfor %}
{% endfor %}

"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = "^(releases/)?v[0-9]+"
skip_tags = "alpha-v.*"

commit_parsers = [
  { message = "^fixup", skip = true },
  { message = "^revert", skip = true },
  { message = "^test", skip = true },
  { message = "^.+\\(ci\\)", skip = true },
  { message = "^.+\\(cli\\)", skip = true },
  { message = "^.+\\(test\\)", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "update codeart", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", group = "Chore" },
]
