# EFA development configuration example
# All fields hold no default value, so do not omit any field.
[localizations]
# The `localizations` section defines localization settings for the application.

# `default` is the default localization to use.
default = "en"

# `supported` is a list of supported localizations.
supported = ["en", "zh"]

# `translation` is a map for localizing "locale"s
[localizations.translation]
en = "English"
zh = "简体中文"

[version]
# The `version` section is the canonical version source for the project.
# It carries the fields shared by both release tracks; the per-track
# versions live in [version.testing] and [version.stable] below.
# All version files (pubspec.yaml, Cargo.toml, pyproject.toml) are synced
# from here, rendered for a selected track (local development: testing).
# Edit this section directly and run `./x generate -f all` to regenerate
# dependent files.
#
# `build` is the Flutter/Android build number (versionCode). It is shared
# by both tracks and must strictly increase between any two consecutive
# release-triggering merges.
build = 1
# `data_schema` is the data schema version used for storage and bundle format.
# Increment when data format or storage layout changes.
data_schema = 1

[version.testing]
# The testing track serves developers and early testers. It renders as
#   major.minor.patch-beta.num+build     (e.g. 1.0.0-beta.1+42)
# `beta` is the only prerelease label and is implied by the track.
# `num` is the prerelease counter; `num = 0` marks the ceremonial
# "rebased, not yet cut" state after a ship commit and is never published.
major = 1
minor = 0
patch = 0
num = 1

[version.stable]
# The stable track serves normal users. It renders as
#   major.minor.patch+build              (e.g. 1.0.0+42)
# major.minor changes only via ship commits (promoting the tested triplet);
# between ships, patch changes only via backport releases.
major = 0
minor = 21
patch = 0

[data_schema]
# The `data_schema` section defines the v2 schema configuration.
# `resource_root` is the server-side URL path prefix for remote content.
resource_root = "efa/v2"

# Resource download classification (eager / lazy / excluded), the RRS
# version, and the shared resource-layout vocabulary are single-sourced in
# data/schema/resource_resolution.toml — they are not configurable here.
# The pipeline derives the stamped download_policy from those rules, and the
# app's resolver is generated from the same file.

[paths]
# `paths` section defines some global paths used to store resources or outputs
# Most of the paths are suggested not to change.
#
# Its generally not encouraged to use an absolute path for the paths.
# Paths recognized as relative paths are resolved against the project's root.

# Python log dir
log = "data/log"

[resources.example]
# The `resources` section offers support for multi-datasource generation.
# the `example` is an identifier for the resource.
#
# Resources are recommended to store in the `data/resources/<resource-name>` folder.

# The descriptor is a metadata file for a specific resource,
# defining extra paths, urls and resources.
descriptor = "data/resources/example/descriptor.toml"
