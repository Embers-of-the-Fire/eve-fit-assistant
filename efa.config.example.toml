# EFA development configuration example
# All fields hold no default value, so do not omit any field.
[localizations]
# The `localizations` section defines localization settings for the application.

# `default` is the default localization to use.
default = "en"

# `supported` is a list of supported localizations.
supported = ["en", "zh"]

# `translation` is a map for localizing "locale"s
[localizations.translation]
en = "English"
zh = "简体中文"

[version]
# The `version` section is the canonical version source for the project.
# All version files (pubspec.yaml, Cargo.toml, pyproject.toml) are synced from here.
# Edit this section directly and run `./x generate -f all` to regenerate dependent files.
#
# Pre-release: set `pre_label` to a non-empty string and `pre_num >= 1`.
#   Example: pre_label = "beta", pre_num = 4 → 0.1.0-beta.4+1
# Release: set `pre_label = ""` and `pre_num = 0`.
#   Example: 0.1.0+1
# `build` is the Flutter/Android build number (versionCode).
major = 0
minor = 1
patch = 0
pre_label = "beta"
pre_num = 1
build = 1
# `data_schema` is the data schema version used for storage and bundle format.
# Increment when data format or storage layout changes.
data_schema = 1

[data_schema]
# The `data_schema` section defines the v2 schema configuration.
# `resource_root` is the server-side URL path prefix for remote content.
resource_root = "efa/v2"

[download]
# The `download` section configures how the data generator classifies
# resources for downloading. It is bound to the generator implementation,
# not to any individual resource descriptor.
#
# `lazy_prefixes` lists resource path prefixes (relative to "resource://")
# that are marked NON_FORCE in generated resource snapshots. NON_FORCE
# resources are not downloaded ahead of time during provisioning; clients
# fetch them lazily on first access. Every other resource is FORCE and is
# downloaded eagerly.
#
# When the whole section (or this key) is omitted, the built-in default
# applies: images and the per-locale localization databases are lazy. The
# legacy combined localization database is deliberately not lazy — it stays
# FORCE for released clients. Set an empty list to force everything.
lazy_prefixes = ["static/images/", "localization/locales/"]

[resolution]
# The `resolution` section is the shared resource-resolution vocabulary: the
# strings the app and the data pipeline must agree on (resource-id scheme,
# localization database paths, image prefix, and the resolution-context
# placeholder name). It is the single source of truth generated into the app
# by the resource-vocabulary codegen; both sides consume it so the server's
# stamped policies and the app's resolution rules cannot silently disagree.
#
# All keys have built-in defaults matching the values below; the whole section
# may be omitted. Override only together with the corresponding app/pipeline
# changes.
# scheme = "resource://"
# legacy_localization_db = "localization/localization.db"
# localization_locales_prefix = "localization/locales/"
# static_images_prefix = "static/images/"
# locale_placeholder = "locale"

[paths]
# `paths` section defines some global paths used to store resources or outputs
# Most of the paths are suggested not to change.
#
# Its generally not encouraged to use an absolute path for the paths.
# Paths recognized as relative paths are resolved against the project's root.

# Python log dir
log = "data/log"

[resources.example]
# The `resources` section offers support for multi-datasource generation.
# the `example` is an identifier for the resource.
#
# Resources are recommended to store in the `data/resources/<resource-name>` folder.

# The descriptor is a metadata file for a specific resource,
# defining extra paths, urls and resources.
descriptor = "data/resources/example/descriptor.toml"
