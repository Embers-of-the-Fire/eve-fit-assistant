# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "logo/logo.png"

  android: true
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true

  windows:
    generate: true
    image_path: "logo/logo-256.png"
    icon_size: 256

  web:
    generate: true
    image_path: "logo/logo.png"
    background_color: "#0a1a2a"
    theme_color: "#0a1a2a"

