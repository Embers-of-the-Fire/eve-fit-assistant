name = "efa-platform-fit-storage"
main = "build/index.js"
compatibility_date = "2026-08-01"

# Binding-only worker: no public route. Reachable via the FIT_STORAGE service
# binding of efa-platform-api (docs/temp/api-unit/spec.md §5). Public Worker
# URLs are disabled since the endpoints have no authentication checks.
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "efa-platform-snapshots"
database_id = "ad8a55e2-3786-4258-ba79-e1f6ed30b498"

[[d1_databases]]
binding = "FIT_DB"
database_name = "efa-platform"
database_id = "2369a517-b61a-4f16-bcd9-8341016fb1b4"

[build]
command = "export PATH=\"$HOME/.cargo/bin:$HOME/.local/bin:$PATH\" && worker-build --release"

[observability]
enabled = true
head_sampling_rate = 1

# Preview chain (spec §4.4): disposable data. Engine data (PLATFORM_DB) is
# read-only and shared with production.
[env.preview]

[[env.preview.d1_databases]]
binding = "PLATFORM_DB"
database_name = "efa-platform-snapshots"
database_id = "ad8a55e2-3786-4258-ba79-e1f6ed30b498"

[[env.preview.d1_databases]]
binding = "FIT_DB"
database_name = "efa-platform-test"
database_id = "f2eacd35-db3d-4162-ac6b-d7c69e3e5aef"
