name = "efa-platform-api"
compatibility_date = "2026-08-01"
main = "src/index.ts"

preview_urls = true

[[routes]]
pattern = "api.efa-tech.dev/platform/internal/*"
zone_name = "efa-tech.dev"

[[routes]]
pattern = "api.efa-tech.dev/platform/auth/*"
zone_name = "efa-tech.dev"

[vars]
EMAIL_FROM = "EFA Platform <noreply@platform.efa-tech.dev>"
PLATFORM_SITE_ORIGIN = "https://platform.efa-tech.dev"

[[d1_databases]]
binding = "FIT_DB"
database_name = "efa-platform"
database_id = "2369a517-b61a-4f16-bcd9-8341016fb1b4"
migrations_dir = "migrations"

# Namespace IDs are provisioned manually (`wrangler kv namespace create
# efa-platform-auth`, plus a preview namespace) and pasted here. Holds the
# short-lived refresh-rotation stash and the resolved-ACL permission cache.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "ea552ca4c83941688be5a7eb8d415164"

# Atomic auth state (OTPs, rate-limit counters). One instance per key;
# SQLite-backed; no manual provisioning — created at deploy via the migration
# below. NOT inherited by [env.preview]: repeated there (isolated as a
# separate deployment).
[[durable_objects.bindings]]
name = "AUTH_OTP"
class_name = "OtpState"

[[durable_objects.bindings]]
name = "AUTH_RATE_LIMIT"
class_name = "RateLimitWindow"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OtpState", "RateLimitWindow"]

[[services]]
binding = "FIT_STORAGE"
service = "efa-platform-fit-storage"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
persist = true
head_sampling_rate = 1

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[cache]
enabled = true

# Preview chain: disposable data.
[env.preview]
routes = [] 
workers_dev = true
preview_urls = true

[env.preview.cache]
enabled = true

[env.preview.vars]
EMAIL_FROM = "EFA Platform Preview <noreply-preview@platform.efa-tech.dev>"
PLATFORM_SITE_ORIGIN = "https://efa-platform-preview.stellarishs.workers.dev"

[[env.preview.d1_databases]]
binding = "FIT_DB"
database_name = "efa-platform-test"
database_id = "f2eacd35-db3d-4162-ac6b-d7c69e3e5aef"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "AUTH_KV"
id = "65ece8bdad724e63951b1143fb1fe9ba"

[[env.preview.durable_objects.bindings]]
name = "AUTH_OTP"
class_name = "OtpState"

[[env.preview.durable_objects.bindings]]
name = "AUTH_RATE_LIMIT"
class_name = "RateLimitWindow"

# Must target the fit-storage worker's `preview` environment explicitly
# (`<name>-preview`, same convention as site/platform's PLATFORM_API binding):
# a service binding without it resolves to the target Worker's default
# (production) environment, leaking preview fits into the production
# `efa-platform` D1 while the preview chain reads `efa-platform-test`.
[[env.preview.services]]
binding = "FIT_STORAGE"
service = "efa-platform-fit-storage-preview" # env=preview for efa-platform-fit-storage

[env.preview.observability]
enabled = true
head_sampling_rate = 1

[env.preview.observability.logs]
enabled = true
persist = true
head_sampling_rate = 1

[env.preview.observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

