name: Release Data Snapshot (reusable)

on:
  workflow_call:
    inputs:
      test_mode:
        description: "Run in test mode (publish to a local MinIO mock instead of the real remote)"
        type: boolean
        default: false
      servers:
        description: "JSON array of server IDs to rebuild (default: all)"
        type: string
        default: "[]"
    secrets:
      CI_STORAGE_ENDPOINT:
        description: "CI storage S3 endpoint"
        required: true
      CI_STORAGE_BUCKET:
        description: "CI storage S3 bucket"
        required: true
      CI_STORAGE_ACCESS_KEY:
        description: "CI storage access key"
        required: true
      CI_STORAGE_SECRET_KEY:
        description: "CI storage secret key"
        required: true
      REMOTE_STORAGE_ENDPOINT:
        description: "Remote S3 endpoint for publishing"
        required: false
      REMOTE_STORAGE_BUCKET:
        description: "Remote S3 bucket for publishing"
        required: false
      REMOTE_STORAGE_ACCESS_KEY:
        description: "Remote S3 access key for publishing"
        required: false
      REMOTE_STORAGE_SECRET_KEY:
        description: "Remote S3 secret key for publishing"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build resource snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Install Python dependencies
        run: nix develop .#python --command bash -c 'uv sync'

      - name: Init dev env
        uses: ./.github/actions/init-dev-env

      - name: Generate protobuf
        run: nix develop .#codegen --command bash -c 'uv run x.py generate protobuf'

      - name: Download raw artifacts and build snapshots
        env:
          SERVERS_JSON: ${{ inputs.servers }}
          CI_ENDPOINT: ${{ secrets.CI_STORAGE_ENDPOINT }}
          CI_BUCKET: ${{ secrets.CI_STORAGE_BUCKET }}
          CI_ACCESS_KEY: ${{ secrets.CI_STORAGE_ACCESS_KEY }}
          CI_SECRET_KEY: ${{ secrets.CI_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env ci.storage.endpoint="${CI_ENDPOINT}" \
              --dev-env ci.storage.bucket="${CI_BUCKET}" \
              --dev-env ci.storage.access_key="${CI_ACCESS_KEY}" \
              --dev-env ci.storage.secret_key="${CI_SECRET_KEY}" \
              ci release-data build \
                --download \
                --servers "${SERVERS_JSON}" \
                --output cache/remote \
                --hashes snapshot-hashes.json'

      - uses: actions/upload-artifact@v4
        with:
          name: v2-snapshots
          path: |
            cache/remote/assets/
            snapshot-hashes.json
          retention-days: 1

  publish:
    name: Publish to testing channel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Install Python dependencies
        run: nix develop .#python --command bash -c 'uv sync'

      - uses: actions/download-artifact@v4
        with:
          name: v2-snapshots
          path: .

      - name: Generate protobuf
        run: nix develop .#codegen --command bash -c 'uv run x.py generate protobuf'

      - name: Init dev env
        uses: ./.github/actions/init-dev-env

      - name: Start MinIO mock
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote mock launch --daemon'

      - name: Sync remote channel head
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ secrets.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote sync \
              --target s3 \
              --channel testing'

      - name: Publish to testing channel
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ secrets.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              ci release-data publish testing \
              --hashes snapshot-hashes.json \
              --schema-root cache/remote \
              --target s3'

      - name: Publish to testing channel (MinIO mock)
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py ci release-data publish testing \
              --hashes snapshot-hashes.json \
              --schema-root cache/remote \
              --target minio'
