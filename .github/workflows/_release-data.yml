name: Release Data Snapshot (reusable)

on:
  workflow_call:
    inputs:
      test_mode:
        description: "Run in test mode (publish to a local RustFS mock instead of the real remote)"
        type: boolean
        default: false
      servers:
        description: "JSON array of server IDs to rebuild (default: all)"
        type: string
        default: "[]"
      rebuild_models:
        description: "Ignore the models build-state cache and reconvert every ship model"
        type: boolean
        default: false
    secrets:
      CI_STORAGE_ENDPOINT:
        description: "CI storage S3 endpoint"
        required: true
      CI_STORAGE_ACCESS_KEY:
        description: "CI storage access key"
        required: true
      CI_STORAGE_SECRET_KEY:
        description: "CI storage secret key"
        required: true
      REMOTE_STORAGE_ENDPOINT:
        description: "Remote S3 endpoint for publishing"
        required: false
      REMOTE_STORAGE_ACCESS_KEY:
        description: "Remote S3 access key for publishing"
        required: false
      REMOTE_STORAGE_SECRET_KEY:
        description: "Remote S3 secret key for publishing"
        required: false
      D1_SYNC_TOKEN:
        description: "Bearer token for the platform D1 data-sync worker"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build resource snapshots
    runs-on: ubuntu-latest
    # production-data supplies REMOTE_STORAGE_* for the models build-state
    # cache (prod blob HEAD checks for in-place references). Test mode gets
    # the empty ci-testing environment: the cache is then disabled and the
    # build-state map is neither read nor written.
    environment: ${{ inputs.test_mode && 'ci-testing' || 'production-data' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Python env
        uses: $/.github/actions/setup-python-env
        with:
          init-dev-env: true

      - name: Generate protobuf
        run: nix develop .#codegen --command bash -c 'uv run x.py generate protobuf'

      - name: Install model converter dependencies
        run: |
          nix develop .#python --command bash -c \
            'pnpm --dir tools/carbon-gr2-to-glb install --frozen-lockfile'

      - name: Download raw artifacts and build snapshots
        env:
          SERVERS_JSON: ${{ inputs.servers }}
          CI_ENDPOINT: ${{ secrets.CI_STORAGE_ENDPOINT }}
          CI_BUCKET: ${{ vars.CI_STORAGE_BUCKET }}
          CI_ACCESS_KEY: ${{ secrets.CI_STORAGE_ACCESS_KEY }}
          CI_SECRET_KEY: ${{ secrets.CI_STORAGE_SECRET_KEY }}
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
          TEST_MODE: ${{ inputs.test_mode }}
          REBUILD_MODELS: ${{ inputs.rebuild_models }}
        run: |
          # Models build-state cache: real runs only, including forced
          # rebuilds. Test mode has no production credentials and must never
          # read or write the shared map.
          MODELS_FLAGS=""
          if [ "${TEST_MODE}" != "true" ]; then
            if [ "${REBUILD_MODELS}" = "true" ]; then
              MODELS_FLAGS="--rebuild-models"
            else
              MODELS_FLAGS="--models-cache"
            fi
          fi
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env ci.storage.endpoint="${CI_ENDPOINT}" \
              --dev-env ci.storage.bucket="${CI_BUCKET}" \
              --dev-env ci.storage.access_key="${CI_ACCESS_KEY}" \
              --dev-env ci.storage.secret_key="${CI_SECRET_KEY}" \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              ci release-data build \
                --download \
                --servers "${SERVERS_JSON}" \
                --output cache/remote \
                --hashes snapshot-hashes.json \
                '"${MODELS_FLAGS}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v2-snapshots
          path: |
            cache/remote/assets/
            snapshot-hashes.json
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.test_mode == false
        with:
          name: build-state-maps
          path: build-state/
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: $/.github/actions/upload-diagnostics
        with:
          name: diagnostics-data-build
          redact-values: |
            ${{ secrets.CI_STORAGE_ACCESS_KEY }}
            ${{ secrets.CI_STORAGE_SECRET_KEY }}

  # The build job writes updated models build-state maps locally but has no
  # write-scoped CI-storage credentials (production-data carries only
  # REMOTE_STORAGE_*; repo-level CI_STORAGE_* are read-only). This job commits
  # the maps with the ci-write environment's write-scoped token. It runs
  # independently of publish: a map entry whose blobs never got published is
  # self-healed by the output-existence check on the next build.
  build-state-upload:
    name: Commit build-state maps
    needs: build
    if: inputs.test_mode == false
    runs-on: ubuntu-slim
    environment: ci-write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-state-maps
          path: build-state

      - name: Setup Python env
        uses: $/.github/actions/setup-python-env
        with:
          init-dev-env: true

      - name: Commit build-state maps to CI storage
        env:
          CI_ENDPOINT: ${{ secrets.CI_STORAGE_ENDPOINT }}
          CI_BUCKET: ${{ vars.CI_STORAGE_BUCKET }}
          CI_ACCESS_KEY: ${{ secrets.CI_STORAGE_ACCESS_KEY }}
          CI_SECRET_KEY: ${{ secrets.CI_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env ci.storage.endpoint="${CI_ENDPOINT}" \
              --dev-env ci.storage.bucket="${CI_BUCKET}" \
              --dev-env ci.storage.access_key="${CI_ACCESS_KEY}" \
              --dev-env ci.storage.secret_key="${CI_SECRET_KEY}" \
              ci build-state commit \
                --from build-state'

      - name: Upload diagnostics
        if: failure()
        uses: $/.github/actions/upload-diagnostics
        with:
          name: diagnostics-build-state-upload
          redact-values: |
            ${{ secrets.CI_STORAGE_ACCESS_KEY }}
            ${{ secrets.CI_STORAGE_SECRET_KEY }}

  publish:
    name: Publish to testing channel
    needs: build
    # RustFS mock runs in test mode; keep on the full runner image.
    runs-on: ubuntu-latest
    environment: ${{ inputs.test_mode && 'ci-testing' || 'production-data' }}
    steps:
      - name: Prepare data release workspace
        uses: $/.github/actions/prepare-data-workspace

      - name: Start RustFS mock
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote mock launch --daemon'

      - name: Sync remote channel head
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote sync \
              --target s3 \
              --channel testing \
              --schema-root cache/remote'

      - name: Publish to testing channel
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              ci release-data publish testing \
              --hashes snapshot-hashes.json \
              --schema-root cache/remote \
              --target s3'

      - name: Publish to testing channel (RustFS mock)
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py ci release-data publish testing \
              --hashes snapshot-hashes.json \
              --schema-root cache/remote \
              --target mock \
              --allow-missing-head'

      - name: Upload diagnostics
        if: failure()
        uses: $/.github/actions/upload-diagnostics
        with:
          name: diagnostics-data-publish
          redact-values: |
            ${{ secrets.CI_STORAGE_ACCESS_KEY }}
            ${{ secrets.CI_STORAGE_SECRET_KEY }}
            ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
            ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}

  d1-sync:
    name: Sync snapshots to platform D1
    needs: publish
    # No D1 mock exists for test mode; real releases only.
    if: inputs.test_mode == false
    runs-on: ubuntu-latest
    environment: production-data
    steps:
      - name: Prepare data release workspace
        uses: $/.github/actions/prepare-data-workspace

      - name: Sync snapshots to platform D1
        uses: $/.github/actions/sync-platform-d1
        with:
          token: ${{ secrets.D1_SYNC_TOKEN }}

      - name: Upload diagnostics
        if: failure()
        uses: $/.github/actions/upload-diagnostics
        with:
          name: diagnostics-data-d1-sync
          redact-values: |
            ${{ secrets.D1_SYNC_TOKEN }}

  notify-qqbot:
    name: Announce data update to QQ bot
    needs: [publish]
    runs-on: ubuntu-slim
    # Post-publish announcement, real releases only: in test mode the publish
    # job targets the RustFS mock, so mock releases never reach the bot. The
    # announcement depends only on the published snapshots, not on the d1-sync
    # job, so a D1 sync failure never suppresses the broadcast. The
    # production-data environment supplies the bot's bearer secret.
    if: |
      always() &&
      needs.publish.result == 'success' &&
      inputs.test_mode == false
    environment: production-data
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: v2-snapshots
          path: .

      # Event API contract (bofa-qqbot EVENT.md): bearer auth plus
      # {"type": "data_update", "payload": {channel, servers: [{id, name, build,
      # version, createdAt}]}}. This job announces the testing-channel publish
      # (channel="testing"); the stable-channel announcement lives in
      # release-data-promote.yml. snapshot-hashes.json lists exactly the servers
      # rebuilt in this run (the publish step's merge only carries forward
      # in-memory); each snapshot's metadata.json carries the localized name,
      # game build/version, and creation timestamp.
      - name: Post data_update event
        env:
          QQBOT_EVENT_SECRET: ${{ secrets.QQBOT_EVENT_SECRET }}
        run: |
          set -euo pipefail
          servers="[]"
          while IFS=$'\t' read -r server_id hash; do
            meta="cache/remote/assets/resources/${hash}/metadata.json"
            if [ ! -f "$meta" ]; then
              echo "::error::Missing snapshot metadata for ${server_id}: ${meta}"
              exit 1
            fi
            servers=$(jq --argjson acc "$servers" \
              '$acc + [{
                id: .serverId,
                name: (.name.zh // .name.en // .serverId),
                build: (.gameBuild | tonumber),
                version: .gameVersion,
                createdAt: .createdAt
              }]' "$meta")
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' snapshot-hashes.json)
          payload=$(jq -n --argjson servers "$servers" \
            '{type: "data_update", payload: {channel: "testing", servers: $servers}}')
          response=$(curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST "https://bot.efa-tech.dev/event" \
            -H "Authorization: Bearer ${QQBOT_EVENT_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "QQ bot response: $response"
