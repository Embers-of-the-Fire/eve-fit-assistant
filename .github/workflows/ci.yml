name: CI

permissions:
  contents: read

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calculate_matrix:
    runs-on: ubuntu-slim
    outputs:
      jobs: ${{ steps.matrix.outputs.jobs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Get changed files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > /tmp/changed.txt
          else
            echo "FULL" > /tmp/changed.txt
          fi
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Calculate job matrix
        id: matrix
        run: |
          if grep -q "^FULL$" /tmp/changed.txt; then
            JOBS=$(uv run x.py ci matrix --full)
          else
            JOBS=$(uv run x.py ci matrix --from-file /tmp/changed.txt)
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.suite }}
    needs: calculate_matrix
    runs-on: ubuntu-latest
    if: ${{ needs.calculate_matrix.outputs.jobs != '' && needs.calculate_matrix.outputs.jobs != '[]' }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.calculate_matrix.outputs.jobs) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Install Python dependencies
        run: nix develop .#python --command bash -c 'uv sync'
      - name: Install Dart dependencies
        if: matrix.suite == 'dart' || matrix.suite == 'dart-web'
        run: nix develop .#dart --command bash -c 'flutter pub get'
      - name: Install JS dependencies
        if: matrix.suite == 'site'
        run: nix develop .#js --command bash -c 'pnpm install'
      - name: Fetch native CI data
        if: matrix.suite == 'dart' || matrix.suite == 'dart-web'
        run: |
          curl -sfLo /tmp/ci-native-data.tar.gz \
            https://ci.storage.efa-tech.dev/build-dependencies/ci-native-data.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/ci-native"
          tar xzf /tmp/ci-native-data.tar.gz -C "$GITHUB_WORKSPACE/ci-native/"
          mkdir -p rust/lib/eve-fit-os/data/out
          ln -sfn "$GITHUB_WORKSPACE/ci-native/pb2" rust/lib/eve-fit-os/data/out/pb2
      - name: Init dev env
        if: matrix.suite == 'dart' || matrix.suite == 'dart-web'
        uses: ./.github/actions/init-dev-env
      - name: Setup CI dev config
        if: matrix.suite == 'dart' || matrix.suite == 'dart-web'
        run: nix develop .#dart --command bash -c 'uv run x.py dev env write-backend'
      - name: Generate code
        run: nix develop .#codegen --command bash -c '${{ matrix.codegen_command }}'
      - name: Lint ${{ matrix.suite }}
        run: nix develop .#${{ matrix.shell }} --command bash -c '${{ matrix.lint_command }}'
      - name: Test ${{ matrix.suite }}
        run: nix develop .#${{ matrix.shell }} --command bash -c '${{ matrix.command }}'

      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-ci-${{ matrix.suite }}
