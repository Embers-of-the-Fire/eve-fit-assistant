name: CI

permissions:
  contents: read

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calculate_matrix:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.matrix.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > /tmp/changed.txt
          else
            echo "FULL" > /tmp/changed.txt
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Calculate job matrix
        id: matrix
        run: |
          if grep -q "^FULL$" /tmp/changed.txt; then
            JOBS=$(uv run x.py ci matrix --full)
          else
            JOBS=$(uv run x.py ci matrix --from-file /tmp/changed.txt)
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.suite }}
    needs: calculate_matrix
    runs-on: ubuntu-latest
    if: ${{ needs.calculate_matrix.outputs.jobs != '' && needs.calculate_matrix.outputs.jobs != '[]' }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.calculate_matrix.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Install dependencies
        run: nix develop --command bash -c 'uv run x.py dev env install'
      - name: Generate code
        run: nix develop --command bash -c 'uv run x.py generate all'
      - name: Lint ${{ matrix.suite }}
        run: nix develop --command bash -c '${{ matrix.lint_command }}'
      - name: Test ${{ matrix.suite }}
        run: nix develop --command bash -c '${{ matrix.command }}'
