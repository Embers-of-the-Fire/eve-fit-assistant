name: Update Raw EVE Data

permissions:
  contents: read

on:
  schedule:
    # 04:00 UTC = 12:00 UTC+8
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [dev]

# Non-PR runs must never be canceled mid-flight: the upload job writes to CI
# storage, and the chained _release-data.yml publish runs nested inside this
# run against the remote channel, whose publish cycle is not interruptible.
# They queue sequentially instead. All non-PR runs share the fixed
# `data-release` group with release-data.yml (the manual dispatch entry): a
# manual dispatch may target a branch or tag other than this run's cron ref,
# so a ref-dependent group would let it overlap this run's publish. PR test
# runs have no remote side effects and stay per-ref and cancelable.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('data-release-{0}', github.ref) || 'data-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Evaluate PR gate
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.gate.outputs.raw_data_update }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate gates
        id: gate
        uses: $/.github/actions/pr-gate
        with:
          labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          repository: ${{ github.repository }}
          head-repo-fork: ${{ github.event.pull_request.head.repo.fork }}

  check:
    name: Check for updates
    needs: gate
    if: >-
      (github.event_name == 'pull_request' && needs.gate.outputs.run == 'true') ||
      (github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/dev' &&
        github.repository == 'Embers-of-the-Fire/eve-fit-assistant' &&
        github.event.repository.fork == false)
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_updates: ${{ steps.matrix.outputs.has_updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Python env
        uses: $/.github/actions/setup-python-env
        with:
          init-dev-env: true

      - name: Determine update matrix
        id: matrix
        run: |
          MATRIX=$(nix develop .#python --command bash -c \
            'uv run x.py ci raw-data check --all --format json')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ] || [ -z "$MATRIX" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload diagnostics
        if: failure()
        uses: $/.github/actions/upload-diagnostics
        with:
          name: diagnostics-raw-check

  update:
    name: Update raw artifacts
    needs: check
    if: ${{ needs.check.outputs.matrix != '' && needs.check.outputs.matrix != '[]' }}
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        server: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # No python-version input: setup-uv picks up the repo's .python-version.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python dependencies
        run: uv sync

      - name: Init dev env
        uses: $/.github/actions/init-dev-env

      - name: Download portable Python 2.7
        run: uv run x.py ci raw-data setup-py27

      - name: Update raw artifacts
        shell: bash
        env:
          SERVER: ${{ matrix.server }}
        run: uv run x.py ci raw-data update --server "${SERVER}" --no-upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-artifacts-${{ matrix.server }}
          path: cache/raw-artifacts/${{ matrix.server }}/
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: $/.github/actions/upload-diagnostics
        with:
          name: diagnostics-raw-update-${{ matrix.server }}

  # PR runs are test-only and never upload.
  upload:
    name: Upload raw artifacts
    needs: [check, update]
    if: |
      github.event_name != 'pull_request' &&
      needs.check.outputs.matrix != '' &&
      needs.check.outputs.matrix != '[]'
    runs-on: ubuntu-slim
    environment: ci-write
    strategy:
      matrix:
        server: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: raw-artifacts-${{ matrix.server }}
          path: raw-artifacts/${{ matrix.server }}/

      - name: Setup Python env
        uses: $/.github/actions/setup-python-env
        with:
          init-dev-env: true

      - name: Upload to CI storage
        env:
          SERVER: ${{ matrix.server }}
          CI_ENDPOINT: ${{ secrets.CI_STORAGE_ENDPOINT }}
          CI_BUCKET: ${{ vars.CI_STORAGE_BUCKET }}
          CI_ACCESS_KEY: ${{ secrets.CI_STORAGE_ACCESS_KEY }}
          CI_SECRET_KEY: ${{ secrets.CI_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env ci.storage.endpoint="$CI_ENDPOINT" \
              --dev-env ci.storage.bucket="$CI_BUCKET" \
              --dev-env ci.storage.access_key="$CI_ACCESS_KEY" \
              --dev-env ci.storage.secret_key="$CI_SECRET_KEY" \
              ci raw-data upload --server "$SERVER" --from-dir raw-artifacts/"$SERVER"/'

      - name: Upload diagnostics
        if: failure()
        uses: $/.github/actions/upload-diagnostics
        with:
          name: diagnostics-raw-upload-${{ matrix.server }}
          redact-values: |
            ${{ secrets.CI_STORAGE_ACCESS_KEY }}
            ${{ secrets.CI_STORAGE_SECRET_KEY }}

  release:
    name: Release data snapshot
    needs: [check, upload]
    if: |
      github.event_name != 'pull_request' &&
      needs.check.outputs.has_updates == 'true'
    # CI_STORAGE_* are repo-level read-only; _release-data.yml's build job
    # needs them.  Remote/ write-scoped credentials come from per-job
    # environments downstream and are not available here.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: $/.github/workflows/_release-data.yml
    with:
      test_mode: false
      servers: ${{ needs.check.outputs.matrix }}
