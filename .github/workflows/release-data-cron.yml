name: Release Data Snapshot (cron)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      test_mode:
        description: "Run in test mode (skip publish)"
        type: boolean
        default: false
      servers:
        description: "JSON array of server IDs to rebuild (default: all)"
        type: string
        default: "[]"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run in test mode (skip publish)"
        type: boolean
        default: false
      servers:
        description: "JSON array of server IDs to rebuild (default: all)"
        type: string
        default: "[]"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish
    uses: ./.github/workflows/_release-data.yml
    # Inherit repo-level CI_STORAGE_* for the build job (no environment).
    # The publish job gets REMOTE_STORAGE_* from environment: production-data
    # and does not need them via workflow_call.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      test_mode: ${{ inputs.test_mode }}
      servers: ${{ inputs.servers }}