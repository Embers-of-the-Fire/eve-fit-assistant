name: Release

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [dev]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identify:
    name: Identify release PR
    runs-on: ubuntu-slim
    outputs:
      skip: ${{ steps.identify.outputs.skip }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: identify
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const releasePrs = prs.data
              .filter((pr) => pr.merged_at && pr.labels.some((l) => l.name === "V-Release"))
              .sort((a, b) => new Date(b.merged_at).getTime() - new Date(a.merged_at).getTime());
            if (releasePrs.length === 0) {
              core.info("No V-Release merged PR associated with this push; skipping.");
              core.setOutput("skip", "true");
              return;
            }
            const releasePr = releasePrs[0];
            if (!releasePr.labels.some((l) => l.name === "V-Tested Release")) {
              core.setFailed(
                `V-Release PR #${releasePr.number} is missing the V-Tested Release label; aborting release.`
              );
              return;
            }
            core.info(`Found V-Release PR #${releasePr.number} with V-Tested Release`);
            core.setOutput("skip", "false");

  release:
    name: Build and publish
    needs: identify
    if: needs.identify.outputs.skip == 'false'
    permissions:
      contents: write
    # _release.yml declares `environment: production-app` and references those
    # secrets directly, but without secrets:inherit the environment context fails
    # to resolve inside the reusable workflow — causing EFA_* signing vars to be
    # empty and the Android build to abort with an incomplete signing config.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: ./.github/workflows/_release.yml
    with:
      test_mode: false
