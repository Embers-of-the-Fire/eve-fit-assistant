name: Release

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [dev]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identify:
    name: Identify release PR
    runs-on: ubuntu-slim
    outputs:
      skip: ${{ steps.identify.outputs.skip }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: identify
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const releasePrs = prs.data
              .filter((pr) => pr.merged_at && pr.labels.some((l) => l.name === "V-Release"))
              .sort((a, b) => new Date(b.merged_at).getTime() - new Date(a.merged_at).getTime());
            if (releasePrs.length === 0) {
              core.info("No V-Release merged PR associated with this push; skipping.");
              core.setOutput("skip", "true");
              return;
            }
            const releasePr = releasePrs[0];
            if (!releasePr.labels.some((l) => l.name === "V-Tested Release")) {
              core.setFailed(
                `V-Release PR #${releasePr.number} is missing the V-Tested Release label; aborting release.`
              );
              return;
            }
            core.info(`Found V-Release PR #${releasePr.number} with V-Tested Release`);
            core.setOutput("skip", "false");

  intent:
    name: Classify release intent
    needs: identify
    if: needs.identify.outputs.skip == 'false'
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.intent.outputs.track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Setup Python env
        uses: $/.github/actions/setup-python-env

      # The parsed config diff against the pre-push ref decides the release
      # track (spec §5.1): the labels gate the run, the diff is the intent.
      - name: Classify the merged version diff
        id: intent
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # shellcheck disable=SC2016
          intent_json=$(nix develop .#python --command bash -c \
            'uv run x.py ci release intent --base-ref "$BEFORE"' | tail -n 1)
          echo "Intent: $intent_json"
          action=$(echo "$intent_json" | jq -r '.action')
          if [ "$action" = "none" ]; then
            reason=$(echo "$intent_json" | jq -r '.reason')
            echo "::error::V-Release merge carries no release intent: $reason"
            exit 1
          fi
          echo "track=$(echo "$intent_json" | jq -r '.track')" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: [identify, intent]
    if: needs.identify.outputs.skip == 'false'
    permissions:
      contents: write
      # _release.yml's site-deploy job declares pull-requests: write for its
      # (test-mode-only) sticky comment; caller grants must cover it.
      pull-requests: write
    # _release.yml declares `environment: production-app` and references those
    # secrets directly, but without secrets:inherit the environment context fails
    # to resolve inside the reusable workflow — causing EFA_* signing vars to be
    # empty and the Android build to abort with an incomplete signing config.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: $/.github/workflows/_release.yml
    with:
      test_mode: false
      track: ${{ needs.intent.outputs.track }}
