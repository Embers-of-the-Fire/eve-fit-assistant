name: Release (test)

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [dev]

concurrency:
  group: release-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and test release
    permissions:
      contents: write
      # _release.yml's site-deploy job declares pull-requests: write for its
      # test-mode sticky comment; caller grants must cover it.
      pull-requests: write
    if: |
      (
        contains(github.event.pull_request.labels.*.name, 'D-Full CI') ||
        contains(github.event.pull_request.labels.*.name, 'D-CI-App Release')
      ) &&
      github.repository == 'Embers-of-the-Fire/eve-fit-assistant' &&
      github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/_release.yml
    with:
      test_mode: true
