name: Release (reusable)

on:
  workflow_call:
    inputs:
      test_mode:
        description: "Run in test mode (skip tag, remote publish, and remote side effects)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.test_mode && 'ci-testing' || 'production-app' }}
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install Python dependencies
        run: nix develop .#python --command bash -c 'uv sync'

      - name: Verify release version
        id: verify
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py ci release verify --check-notes' | tee /tmp/verify.log
          echo "version=$(grep '^Canonical version:' /tmp/verify.log | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"
          echo "tag=$(grep '^Expected tag:' /tmp/verify.log | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"

      - name: Init dev env
        uses: ./.github/actions/init-dev-env

      - name: Setup CI developer config
        run: nix develop .#python --command bash -c 'uv run x.py dev env write-backend'

      - name: Fetch native CI data
        run: |
          curl -sfLo /tmp/ci-native-data.tar.gz \
            https://ci.storage.efa-tech.dev/build-dependencies/ci-native-data.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/ci-native"
          tar xzf /tmp/ci-native-data.tar.gz -C "$GITHUB_WORKSPACE/ci-native/"
          mkdir -p rust/lib/eve-fit-os/data/out
          ln -sfn "$GITHUB_WORKSPACE/ci-native/pb2" rust/lib/eve-fit-os/data/out/pb2

      - name: Install Flutter dependencies
        run: nix develop .#android --command bash -c 'flutter pub get'

      - name: Generate all
        run: nix develop .#android --command bash -c 'uv run x.py generate -f all'

      - name: Prepare release signing
        if: inputs.test_mode == false
        env:
          APP_KEYSTORE: ${{ secrets.APP_KEYSTORE }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          printf '%s' "$APP_KEYSTORE" | base64 -d > "$RUNNER_TEMP/efa-release.keystore"
          chmod 600 "$RUNNER_TEMP/efa-release.keystore"
          {
            echo "EFA_KEYSTORE_FILE=$RUNNER_TEMP/efa-release.keystore"
            echo "EFA_KEYSTORE_PASSWORD=$APP_KEYSTORE_PASSWORD"
            echo "EFA_KEY_ALIAS=$APP_KEY_ALIAS"
            echo "EFA_KEY_PASSWORD=$APP_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: nix develop .#android --command bash -c 'uv run x.py build apk'

      - name: Verify APK signature
        if: inputs.test_mode == false
        env:
          APP_KEY_SHA256: ${{ vars.APP_KEY_SHA256 }}
        run: |
          nix develop .#android --command bash -c \
            'uv run x.py ci release verify-signing'

      - name: Merge release registry
        env:
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            "uv run x.py build release --fragments cache/releases/apk/${VERSION}/${VERSION}-android.json"

      - name: Start MinIO mock
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote mock launch --daemon'

      - name: Sync remote channel head
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote sync \
              --target s3 \
              --channel testing \
              --schema-root cache/remote'

      - name: Initialize remote announcement workspace (MinIO mock)
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote announce init --target minio --force'

      - name: Sync remote announcements
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote announce sync \
              --target s3'

      - name: Sync remote announcements (MinIO mock)
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote announce sync --target minio'

      - name: Stage release note as announcement
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote announce add-release-note'

      - name: Stage release snapshot
        env:
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            "uv run x.py remote session init testing --schema-root cache/remote"
          nix develop .#python --command bash -c \
            "uv run x.py remote session add --release --file cache/releases/merge/${VERSION}.json --schema-root cache/remote"

      - name: Verify and commit generation
        id: commit
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote session verify --schema-root cache/remote'
          committed_hash=$(nix develop .#python --command bash -c \
            'uv run x.py remote session commit --json --schema-root cache/remote' | jq -r '.generation_hash')
          echo "committed_hash=$committed_hash" >> "$GITHUB_OUTPUT"

      - name: Publish to testing channel
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote publish testing \
              --target s3 \
              --schema-root cache/remote'

      - name: Publish announcements
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote announce publish \
              --target s3'

      - name: Publish to testing channel (MinIO mock)
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote publish testing \
              --target minio \
              --schema-root cache/remote'

      - name: Publish announcements (MinIO mock)
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote announce publish --target minio'

      - name: Sync and verify remote head
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
          COMMITTED: ${{ steps.commit.outputs.committed_hash }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote sync \
              --target s3 \
              --channel testing \
              --schema-root cache/remote'
          synced_hash=$(nix develop .#python --command bash -c \
            'uv run python -c "from pathlib import Path; from bootstrap.remote import SessionManager; m = SessionManager(Path(\"cache/remote\")); print(m.get_head(\"testing\").generation_hash)"')
          if [ "$synced_hash" != "$COMMITTED" ]; then
            echo "Remote head verification failed: committed=$COMMITTED synced=$synced_hash"
            exit 1
          fi
          echo "Remote head verified: $synced_hash"

      - name: Sync and verify remote head (MinIO mock)
        if: inputs.test_mode
        env:
          COMMITTED: ${{ steps.commit.outputs.committed_hash }}
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote sync \
              --target minio \
              --channel testing \
              --schema-root cache/remote'
          synced_hash=$(nix develop .#python --command bash -c \
            'uv run python -c "from pathlib import Path; from bootstrap.remote import SessionManager; m = SessionManager(Path(\"cache/remote\")); print(m.get_head(\"testing\").generation_hash)"')
          if [ "$synced_hash" != "$COMMITTED" ]; then
            echo "Remote head verification failed: committed=$COMMITTED synced=$synced_hash"
            exit 1
          fi
          echo "Remote head verified: $synced_hash"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: |
            cache/releases/apk/**/*.apk
            cache/releases/apk/**/*.sha1
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-app-release
          redact-values: |
            ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
            ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
            ${{ secrets.APP_KEYSTORE }}
            ${{ secrets.APP_KEYSTORE_PASSWORD }}
            ${{ secrets.APP_KEY_PASSWORD }}
            ${{ secrets.APP_KEY_ALIAS }}

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/efa-release.keystore"

  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    # The AppImage is distributed via GitHub Releases only and is still
    # experimental; never let its failure block the Android release, the
    # remote channel publish, or the surrounding check run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # appimage-builder runs via appimage-run (bubblewrap), which needs
      # unprivileged user namespaces; Ubuntu 24.04 runners restrict them
      # via AppArmor by default.
      - name: Enable unprivileged user namespaces
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Install Python dependencies
        run: nix develop .#python --command bash -c 'uv sync'

      - name: Init dev env
        uses: ./.github/actions/init-dev-env

      - name: Setup CI developer config
        run: nix develop .#python --command bash -c 'uv run x.py dev env write-backend'

      - name: Fetch native CI data
        run: |
          curl -sfLo /tmp/ci-native-data.tar.gz \
            https://ci.storage.efa-tech.dev/build-dependencies/ci-native-data.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/ci-native"
          tar xzf /tmp/ci-native-data.tar.gz -C "$GITHUB_WORKSPACE/ci-native/"
          mkdir -p rust/lib/eve-fit-os/data/out
          ln -sfn "$GITHUB_WORKSPACE/ci-native/pb2" rust/lib/eve-fit-os/data/out/pb2

      - name: Install Flutter dependencies
        run: nix develop .#linux --command bash -c 'flutter pub get'

      - name: Generate all
        run: nix develop .#linux --command bash -c 'uv run x.py generate -f all'

      - name: Build AppImage
        run: nix develop .#linux --command bash -c 'uv run x.py build appimage'

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage
          path: |
            cache/releases/appimage/**/*.AppImage
            cache/releases/appimage/**/*.AppImage.zsync
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-appimage-release

  tag:
    name: Create Git tag
    needs: [release, appimage]
    runs-on: ubuntu-slim
    # Wait for the AppImage job so its artifact can be attached to the GitHub
    # Release, but do not let its (masked) failure block tagging.
    if: |
      always() &&
      needs.release.result == 'success' &&
      inputs.test_mode == false
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install Python dependencies
        run: nix develop .#python --command bash -c 'uv sync'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: cache/releases/apk

      # Optional: only present when the (non-blocking) appimage job succeeded.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: appimage
          path: cache/releases/appimage

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.TAG;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.setFailed(`Tag ${tag} already exists; aborting.`);
              return;
            } catch (error) {
              const status = error.status || error.response?.status;
              if (status !== 404) {
                throw error;
              }
            }
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });
            core.info(`Created tag ${tag}`)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py ci release github-release \
              --version "$VERSION" \
              --tag "$TAG"'
