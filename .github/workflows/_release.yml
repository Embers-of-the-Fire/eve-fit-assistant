name: Release (reusable)

on:
  workflow_call:
    inputs:
      test_mode:
        description: "Run in test mode (skip tag, remote publish, and remote side effects)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install Python dependencies
        run: nix develop .#python --command bash -c 'uv sync'

      - name: Verify release version
        id: verify
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py ci release verify --check-notes' | tee /tmp/verify.log
          echo "version=$(grep '^Canonical version:' /tmp/verify.log | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"
          echo "tag=$(grep '^Expected tag:' /tmp/verify.log | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"

      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-release-verify

  android:
    name: Build Android APK
    needs: [verify]
    runs-on: ubuntu-latest
    environment: ${{ inputs.test_mode && 'ci-testing' || 'production-app' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Setup build env
        uses: ./.github/actions/setup-build-env
        with:
          shell: android

      - name: Prepare release signing
        if: inputs.test_mode == false
        env:
          APP_KEYSTORE: ${{ secrets.APP_KEYSTORE }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          printf '%s' "$APP_KEYSTORE" | base64 -d > "$RUNNER_TEMP/efa-release.keystore"
          chmod 600 "$RUNNER_TEMP/efa-release.keystore"
          {
            echo "EFA_KEYSTORE_FILE=$RUNNER_TEMP/efa-release.keystore"
            echo "EFA_KEYSTORE_PASSWORD=$APP_KEYSTORE_PASSWORD"
            echo "EFA_KEY_ALIAS=$APP_KEY_ALIAS"
            echo "EFA_KEY_PASSWORD=$APP_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: nix develop .#android --command bash -c 'uv run x.py build apk'

      - name: Verify APK signature
        if: inputs.test_mode == false
        env:
          APP_KEY_SHA256: ${{ vars.APP_KEY_SHA256 }}
        run: |
          nix develop .#android --command bash -c \
            'uv run x.py ci release verify-signing'

      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: |
            cache/releases/apk/**/*.apk
            cache/releases/apk/**/*.sha1
            cache/releases/apk/**/*.json
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-android-release
          redact-values: |
            ${{ secrets.APP_KEYSTORE }}
            ${{ secrets.APP_KEYSTORE_PASSWORD }}
            ${{ secrets.APP_KEY_PASSWORD }}
            ${{ secrets.APP_KEY_ALIAS }}

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/efa-release.keystore"

  linux:
    name: Build Linux Variants
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Setup build env
        uses: ./.github/actions/setup-build-env
        with:
          shell: linux

      - name: Build Linux variants
        run: nix develop .#linux --command bash -c 'uv run x.py build linux'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: |
            cache/releases/linux/**/*.AppImage
            cache/releases/linux/**/*.AppImage.zsync
            cache/releases/linux/**/*.zip
            cache/releases/linux/**/*.json
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-linux-release

  windows:
    name: Build Windows Variants
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Setup build env
        uses: ./.github/actions/setup-build-env-windows

      - name: Build Windows variants
        shell: pwsh
        run: uv run x.py build windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            cache/releases/windows/**/*.zip
            cache/releases/windows/**/*.msi
            cache/releases/windows/**/*.json
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-windows-release

  site:
    name: Build web bundle
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false

      - name: Build web bundle
        uses: ./.github/actions/build-web

      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-site-release

  site-deploy:
    name: Deploy web bundle
    needs: [verify, site]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Test mode deploys to the nightly Pages project (and pins a comment on
    # the release PR); real releases deploy to the production Pages project.
    environment: ${{ inputs.test_mode && 'web-preview' || 'web-production' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Deploy web bundle
        uses: ./.github/actions/deploy-web-pages
        with:
          flavor: ${{ inputs.test_mode && 'nightly' || 'prod' }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Test mode deploys as a branch preview so it does not become the
          # production-environment deployment that site-nightly uses as its
          # change baseline (a PR SHA is unreachable from dev and would force
          # a full nightly rebuild).
          branch: ${{ inputs.test_mode && 'release-test' || '' }}
          commit-hash: ${{ github.sha }}
          comment: ${{ inputs.test_mode && 'true' || 'false' }}
          comment-header: web-release-test

  publish:
    name: Merge and publish to remote channel
    needs: [verify, android, linux, windows]
    runs-on: ubuntu-latest
    environment: ${{ inputs.test_mode && 'ci-testing' || 'production-app' }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install Python dependencies
        run: nix develop .#python --command bash -c 'uv sync'

      - name: Init dev env
        uses: ./.github/actions/init-dev-env

      # The remote session/publish tooling imports generated pb2 modules
      # (bootstrap/data/schema, gitignored). The .#python shell has no protoc,
      # so use the .#dart shell.
      - name: Generate protobuf bindings
        run: nix develop .#dart --command bash -c 'uv run x.py generate protobuf'

      # Platform artifacts (binaries + release fragments) produced by the
      # per-platform build jobs above.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: cache/releases/apk

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux
          path: cache/releases/linux

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows
          path: cache/releases/windows

      - name: Merge release registry
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            "uv run x.py build release \
              --fragments cache/releases/apk/${VERSION}/${VERSION}-android.json \
              --fragments cache/releases/linux/${VERSION}/${VERSION}-linux.json \
              --fragments cache/releases/windows/${VERSION}/${VERSION}-windows.json"

      - name: Start MinIO mock
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote mock launch --daemon'

      - name: Sync remote channel head
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote sync \
              --target s3 \
              --channel testing \
              --schema-root cache/remote'

      - name: Initialize remote announcement workspace (MinIO mock)
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote announce init --target minio --force'

      - name: Sync remote announcements
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote announce sync \
              --target s3'

      - name: Sync remote announcements (MinIO mock)
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote announce sync --target minio'

      - name: Stage release note as announcement
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote announce add-release-note'

      - name: Stage release snapshot
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            "uv run x.py remote session init testing --schema-root cache/remote"
          nix develop .#python --command bash -c \
            "uv run x.py remote session add --release --file cache/releases/merge/${VERSION}.json --schema-root cache/remote"

      - name: Verify and commit generation
        id: commit
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote session verify --schema-root cache/remote'
          committed_hash=$(nix develop .#python --command bash -c \
            'uv run x.py remote session commit --json --schema-root cache/remote' | jq -r '.generation_hash')
          echo "committed_hash=$committed_hash" >> "$GITHUB_OUTPUT"

      - name: Publish to testing channel
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote publish testing \
              --target s3 \
              --schema-root cache/remote'

      - name: Publish announcements
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote announce publish \
              --target s3'

      - name: Publish to testing channel (MinIO mock)
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote publish testing \
              --target minio \
              --schema-root cache/remote'

      - name: Publish announcements (MinIO mock)
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote announce publish --target minio'

      - name: Sync and verify remote head
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
          COMMITTED: ${{ steps.commit.outputs.committed_hash }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote sync \
              --target s3 \
              --channel testing \
              --schema-root cache/remote'
          synced_hash=$(nix develop .#python --command bash -c \
            'uv run python -c "from pathlib import Path; from bootstrap.remote import SessionManager; m = SessionManager(Path(\"cache/remote\")); print(m.get_head(\"testing\").generation_hash)"')
          if [ "$synced_hash" != "$COMMITTED" ]; then
            echo "Remote head verification failed: committed=$COMMITTED synced=$synced_hash"
            exit 1
          fi
          echo "Remote head verified: $synced_hash"

      - name: Sync and verify remote head (MinIO mock)
        if: inputs.test_mode
        env:
          COMMITTED: ${{ steps.commit.outputs.committed_hash }}
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote sync \
              --target minio \
              --channel testing \
              --schema-root cache/remote'
          synced_hash=$(nix develop .#python --command bash -c \
            'uv run python -c "from pathlib import Path; from bootstrap.remote import SessionManager; m = SessionManager(Path(\"cache/remote\")); print(m.get_head(\"testing\").generation_hash)"')
          if [ "$synced_hash" != "$COMMITTED" ]; then
            echo "Remote head verification failed: committed=$COMMITTED synced=$synced_hash"
            exit 1
          fi
          echo "Remote head verified: $synced_hash"

      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-app-publish
          redact-values: |
            ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
            ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}

  tag:
    name: Create Git tag
    needs: [verify, android, linux, windows, publish]
    runs-on: ubuntu-slim
    # Tag only after every platform build succeeded and the remote channel has
    # accepted the joined (multi-platform) release.
    if: |
      always() &&
      needs.verify.result == 'success' &&
      needs.android.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.publish.result == 'success' &&
      inputs.test_mode == false
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: cache/releases/apk

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux
          path: cache/releases/linux

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows
          path: cache/releases/windows

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: bofa-bot
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      # The bot token (not GITHUB_TOKEN) is required here: creating a tag whose
      # lineage touches .github/workflows requires the `workflows` permission,
      # which GITHUB_TOKEN cannot be granted — git createRef then fails with
      # 403 "Resource not accessible by integration".
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.bofa-bot.outputs.token }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const tag = process.env.TAG;
            const version = process.env.VERSION;
            const semver = version.split("+")[0];
            const { owner, repo } = context.repo;

            let tagExists = true;
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              const status = error.status || error.response?.status;
              if (status !== 404) {
                throw error;
              }
              tagExists = false;
            }
            if (tagExists) {
              core.info(`Tag ${tag} already exists; reusing it and its release.`);
            } else {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Created tag ${tag}`);
            }

            const notesDir = `docs/changelog/${semver.replaceAll(".", "-")}`;
            const contentPath = `${notesDir}/content.en.md`;
            const changelogPath = `${notesDir}/changelog.md`;
            for (const required of [contentPath, changelogPath]) {
              if (!fs.existsSync(required)) {
                core.setFailed(`Missing ${required}`);
                return;
              }
            }
            const enLines = fs.readFileSync(contentPath, "utf8").split("\n");
            const h1Index = enLines.findIndex((line) => line.startsWith("# "));
            if (h1Index === -1) {
              core.setFailed(`${contentPath} is missing a level-1 heading`);
              return;
            }
            const humanBody = enLines.slice(h1Index + 1).join("\n").trim();
            const changelogBody = fs.readFileSync(changelogPath, "utf8").trim();
            const notes = `${humanBody}\n\n## Full Changelog\n\n${changelogBody}\n`;

            const apkFiles = [
              ...(await (await glob.create(`cache/releases/apk/${version}/*.apk`)).glob()),
              ...(await (await glob.create(`cache/releases/apk/${version}/*.sha1`)).glob()),
            ].sort();
            if (apkFiles.length === 0) {
              core.setFailed(`No APK assets found in cache/releases/apk/${version}`);
              return;
            }
            const linuxFiles = [
              ...(await (await glob.create(`cache/releases/linux/${version}/*.AppImage`)).glob()),
              ...(await (await glob.create(`cache/releases/linux/${version}/*.AppImage.zsync`)).glob()),
              ...(await (await glob.create(`cache/releases/linux/${version}/*.zip`)).glob()),
            ].sort();
            core.info(
              linuxFiles.length > 0
                ? `Including ${linuxFiles.length} Linux asset(s)`
                : "No Linux artifacts found; releasing Android assets only",
            );
            const windowsFiles = [
              ...(await (await glob.create(`cache/releases/windows/${version}/*.zip`)).glob()),
              ...(await (await glob.create(`cache/releases/windows/${version}/*.msi`)).glob()),
            ].sort();
            core.info(
              windowsFiles.length > 0
                ? `Including ${windowsFiles.length} Windows asset(s)`
                : "No Windows artifacts found; releasing without Windows assets",
            );

            let release;
            try {
              release = (
                await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag,
                })
              ).data;
              core.info(`Reusing existing GitHub Release: ${release.html_url}`);
            } catch (error) {
              const status = error.status || error.response?.status;
              if (status !== 404) {
                throw error;
              }
              release = (
                await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  name: `v${semver}`,
                  body: notes,
                  prerelease: semver.includes("-"),
                })
              ).data;
              core.info(`Created GitHub Release: ${release.html_url}`);
            }

            const existingAssets = new Set();
            let page = 1;
            while (true) {
              const { data: assets } = await github.rest.repos.listReleaseAssets({
                owner,
                repo,
                release_id: release.id,
                per_page: 100,
                page,
              });
              for (const asset of assets) {
                existingAssets.add(asset.name);
              }
              if (assets.length < 100) {
                break;
              }
              page += 1;
            }

            for (const file of [...apkFiles, ...linuxFiles, ...windowsFiles]) {
              const name = path.basename(file);
              if (existingAssets.has(name)) {
                core.info(`Skipping existing asset: ${name}`);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(file),
              });
              core.info(`Uploaded asset: ${name}`);
            }
