name: Update Raw EVE Data (cron)

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Check and update raw data
    if: |
      github.ref == 'refs/heads/dev' &&
      github.repository == 'Embers-of-the-Fire/eve-fit-assistant' &&
      github.event.repository.fork == false
    uses: ./.github/workflows/_update-raw-data.yml
    with:
      all: true
      no_upload: false

  release:
    name: Release data snapshot
    needs: update
    if: needs.update.outputs.has_updates == 'true'
    uses: ./.github/workflows/release-data-cron.yml
    # CI_STORAGE_* are repo-level read-only; _release-data.yml's build job
    # needs them.  Remote/ write-scoped credentials come from per-job
    # environments downstream and are not available here.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      test_mode: false
      servers: ${{ needs.update.outputs.matrix }}