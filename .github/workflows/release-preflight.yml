name: Release Preflight

permissions:
  contents: read

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: release-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-check:
    name: Fast preflight checks
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'V-Release')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Install Python dependencies
        run: nix develop .#python --command bash -c 'uv sync'

      - name: Run fast release preflight checks
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py ci release verify \
              --base-ref origin/${{ github.base_ref }} \
              --check-notes --check-tag --check-note-content'

  drop-labels:
    name: Drop test labels on update
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    # Clear stale testing labels on every synchronization.
    # Requiring V-Release allows this bypass: remove V-Release, push a commit, then restore it.
    # The old V-Tested Release label survives and .github/workflows/release.yml accepts an untested head.
    if: |
      github.event.action == 'synchronize'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labelsToRemove = ['V-Test', 'V-Tested Release'];
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
                core.info(`Removed label ${label}`);
              } catch (error) {
                const status = error.status || error.response?.status;
                if (status === 404) {
                  core.info(`Label ${label} was not present`);
                } else {
                  throw error;
                }
              }
            }
