name: Release Preflight

permissions:
  contents: read

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: release-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-check:
    name: Fast preflight checks
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'V-Release')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install Python dependencies
        run: nix develop .#python --command bash -c 'uv sync'

      - name: Run fast release preflight checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py ci release verify \
              --base-ref "origin/${BASE_REF}" \
              --check-notes --check-tag --check-note-content'

      - name: Upload diagnostics
        if: failure()
        uses: ./.github/actions/upload-diagnostics
        with:
          name: diagnostics-preflight

  drop-labels:
    name: Drop test labels on update
    permissions:
      pull-requests: write
    runs-on: ubuntu-slim
    # Drop stale testing labels only when a release branch is updated. This
    # keeps the bypass protection intact (any commit to a release/ PR clears
    # V-Test/V-Tested Release) while avoiding noise on unrelated PRs.
    if: |
      github.event.action == 'synchronize' &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labelsToRemove = ['V-Test', 'V-Tested Release'];
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
                core.info(`Removed label ${label}`);
              } catch (error) {
                const status = error.status || error.response?.status;
                if (status === 404) {
                  core.info(`Label ${label} was not present`);
                } else {
                  throw error;
                }
              }
            }
