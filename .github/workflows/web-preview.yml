name: Web Preview

permissions:
  contents: read

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Skip the build path when the PR is being closed; the cleanup job
    # handles that event instead.
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-slim
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Get changed files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > /tmp/changed.txt
          else
            echo "FULL" > /tmp/changed.txt
          fi
      - name: Check web preview relevance
        id: filter
        run: |
          if grep -q "^FULL$" /tmp/changed.txt; then
            BUILD=$(uv run x.py ci web-affected --full)
          else
            BUILD=$(uv run x.py ci web-affected --from-file /tmp/changed.txt)
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Fork PRs cannot access the deployment environments, so they get no
    # preview; skip the build entirely.
    if: >-
      needs.changes.outputs.build == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Fetch native CI data
        run: |
          curl -sfLo /tmp/ci-native-data.tar.gz \
            https://ci.storage.efa-tech.dev/build-dependencies/ci-native-data.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/ci-native"
          tar xzf /tmp/ci-native-data.tar.gz -C "$GITHUB_WORKSPACE/ci-native/"
          mkdir -p rust/lib/eve-fit-os/data/out
          ln -sfn "$GITHUB_WORKSPACE/ci-native/pb2" rust/lib/eve-fit-os/data/out/pb2
      - name: Init dev env
        uses: ./.github/actions/init-dev-env
      - name: Install Python dependencies
        run: nix develop .#codegen --command bash -c 'uv sync'
      - name: Install Dart dependencies
        run: nix develop .#codegen --command bash -c 'flutter pub get'
      - name: Write backend env
        run: nix develop .#codegen --command bash -c 'uv run x.py dev env write-backend'
      - name: Generate code
        run: nix develop .#codegen --command bash -c 'uv run x.py ci codegen --lang dart'
      - name: Build web bundle
        run: nix develop .#codegen --command bash -c 'uv run x.py build web'
      - name: Upload web bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-bundle
          path: build/web
          retention-days: 1

  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: web-preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-bundle
          path: build/web
      - name: Compute deploy command
        id: args
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "command=pages deploy build/web --project-name=efa-app --branch=$HEAD_REF" \
            >> "$GITHUB_OUTPUT"
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: ${{ steps.args.outputs.command }}
      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: web-preview
          message: |
            Web preview deployed to Cloudflare Pages (`efa-app`).

            | | |
            |---|---|
            | Deployment | ${{ steps.deploy.outputs.deployment-url }} |
            | Branch alias | ${{ steps.deploy.outputs.pages-deployment-alias-url }} |
            | Commit | ${{ github.sha }} |

            Build: `x build web` (wasm, skwasm renderer, locally bundled canvaskit).

  deploy-production:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploy to the Pages production URL; the project's production branch must
    # be set to "dev" (one-time setup in the Cloudflare dashboard).
    environment: web-production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-bundle
          path: build/web
      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: pages deploy build/web --project-name=efa-app

  cleanup:
    # Cloudflare keeps preview deployments forever (and refuses to delete a
    # branch's aliased one without force); remove this branch's previews once
    # its PR is merged or closed.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: web-preview
    steps:
      - name: Delete branch preview deployments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOSED_BRANCH: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const branch = process.env.CLOSED_BRANCH;
            if (!accountId || !token || !branch) {
              core.setFailed("Missing CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, or branch.");
              return;
            }
            const project = "efa-app";
            const headers = {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            };
            const base =
              `https://api.cloudflare.com/client/v4/accounts/${accountId}` +
              `/pages/projects/${project}/deployments`;

            const targets = [];
            let page = 1;
            let totalPages = 1;
            do {
              const res = await fetch(`${base}?env=preview&page=${page}&per_page=100`, {
                headers,
              });
              const body = await res.json();
              if (!res.ok || !body.success) {
                core.setFailed(`Listing deployments failed: ${JSON.stringify(body.errors ?? body)}`);
                return;
              }
              for (const d of body.result) {
                if (
                  d.environment === "preview" &&
                  d.deployment_trigger?.metadata?.branch === branch
                ) {
                  targets.push(d);
                }
              }
              totalPages = body.result_info?.total_pages ?? 1;
              page += 1;
            } while (page <= totalPages);

            core.info(`Found ${targets.length} preview deployment(s) for branch '${branch}'.`);
            let failed = 0;
            for (const d of targets) {
              // force=true also deletes the branch's aliased (latest) deployment.
              const res = await fetch(`${base}/${d.id}?force=true`, {
                method: "DELETE",
                headers,
              });
              const body = await res.json().catch(() => ({}));
              if (res.ok && body.success) {
                core.info(`Deleted ${d.id} (${d.url}).`);
              } else {
                failed += 1;
                core.warning(`Could not delete ${d.id}: ${JSON.stringify(body.errors ?? body)}`);
              }
            }
            if (failed > 0) {
              core.setFailed(`${failed} deployment(s) could not be deleted.`);
            }
