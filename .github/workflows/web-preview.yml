name: Web Preview

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Get changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The checkout only fetched history reachable from the PR merge
          # ref; the base/head tips may not be ancestors of it (e.g. when
          # the base branch advanced), so fetch them explicitly.
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
      - name: Check web preview relevance
        id: filter
        run: |
          BUILD=$(uv run x.py ci web-affected --from-file /tmp/changed.txt)
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Fork PRs cannot access the deployment environments, so they get no
    # preview; skip the build entirely. Release PRs (V-Release) get their web
    # bundle built and deployed by release-full.yml's site/site-deploy jobs
    # instead, so skip the duplicate build here. Otherwise the preview is
    # gated on an explicit CI label.
    if: >-
      needs.changes.outputs.build == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'V-Release') &&
      (
        contains(github.event.pull_request.labels.*.name, 'D-CI-Page Preview') ||
        contains(github.event.pull_request.labels.*.name, 'D-Full CI')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - name: Build web bundle
        uses: ./.github/actions/build-web

  deploy-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: web-preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - name: Deploy preview to Cloudflare Pages
        uses: ./.github/actions/deploy-web-pages
        with:
          flavor: nightly
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          branch: ${{ github.head_ref }}
          commit-hash: ${{ github.event.pull_request.head.sha }}
          comment: "true"
          comment-header: web-preview

