name: Web Preview

permissions:
  contents: read

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Skip the build path when the PR is being closed; the cleanup job
    # handles that event instead.
    if: github.event.action != 'closed'
    runs-on: ubuntu-slim
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Get changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The checkout only fetched history reachable from the PR merge
          # ref; the base/head tips may not be ancestors of it (e.g. when
          # the base branch advanced), so fetch them explicitly.
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
      - name: Check web preview relevance
        id: filter
        run: |
          BUILD=$(uv run x.py ci web-affected --from-file /tmp/changed.txt)
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Fork PRs cannot access the deployment environments, so they get no
    # preview; skip the build entirely.
    if: >-
      needs.changes.outputs.build == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - name: Build web bundle
        uses: ./.github/actions/build-web

  deploy-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: web-preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - name: Deploy preview to Cloudflare Pages
        uses: ./.github/actions/deploy-web-pages
        with:
          flavor: nightly
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          branch: ${{ github.head_ref }}
          commit-hash: ${{ github.event.pull_request.head.sha }}
          comment: "true"
          comment-header: web-preview

  cleanup:
    # Cloudflare keeps preview deployments forever (and refuses to delete a
    # branch's aliased one without force); remove this branch's previews once
    # its PR is merged or closed.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: web-preview
    steps:
      - name: Delete branch preview deployments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOSED_BRANCH: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const branch = process.env.CLOSED_BRANCH;
            if (!accountId || !token || !branch) {
              core.setFailed("Missing CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, or branch.");
              return;
            }
            const project = "efa-app-nightly";
            const headers = {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            };
            const base =
              `https://api.cloudflare.com/client/v4/accounts/${accountId}` +
              `/pages/projects/${project}/deployments`;

            const targets = [];
            let page = 1;
            let totalPages = 1;
            do {
              const res = await fetch(`${base}?env=preview&page=${page}&per_page=100`, {
                headers,
              });
              const body = await res.json();
              if (!res.ok || !body.success) {
                core.setFailed(`Listing deployments failed: ${JSON.stringify(body.errors ?? body)}`);
                return;
              }
              for (const d of body.result) {
                if (
                  d.environment === "preview" &&
                  d.deployment_trigger?.metadata?.branch === branch
                ) {
                  targets.push(d);
                }
              }
              totalPages = body.result_info?.total_pages ?? 1;
              page += 1;
            } while (page <= totalPages);

            core.info(`Found ${targets.length} preview deployment(s) for branch '${branch}'.`);
            let failed = 0;
            for (const d of targets) {
              // force=true also deletes the branch's aliased (latest) deployment.
              const res = await fetch(`${base}/${d.id}?force=true`, {
                method: "DELETE",
                headers,
              });
              const body = await res.json().catch(() => ({}));
              if (res.ok && body.success) {
                core.info(`Deleted ${d.id} (${d.url}).`);
              } else {
                failed += 1;
                core.warning(`Could not delete ${d.id}: ${JSON.stringify(body.errors ?? body)}`);
              }
            }
            if (failed > 0) {
              core.setFailed(`${failed} deployment(s) could not be deleted.`);
            }
