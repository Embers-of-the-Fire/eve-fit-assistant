name: Web Preview

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Evaluate PR gate
    runs-on: ubuntu-slim
    outputs:
      preview: ${{ steps.gate.outputs.web_preview }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Evaluate gates
        id: gate
        uses: ./.github/actions/pr-gate
        with:
          labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          repository: ${{ github.repository }}
          head-repo-fork: ${{ github.event.pull_request.head.repo.fork }}

  changes:
    runs-on: ubuntu-slim
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - name: Check web preview relevance
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The checkout only fetched history reachable from the PR merge
          # ref; the base/head tips may not be ancestors of it (e.g. when
          # the base branch advanced), so fetch them explicitly.
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          BUILD=$(uv run x.py ci web-gate --target "$BASE_SHA" --head "$HEAD_SHA")
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: [changes, gate]
    # Fork PRs cannot access the deployment environments, so they get no
    # preview; skip the build entirely. Release PRs (V-Release) get their web
    # bundle built and deployed by release-test.yml's site/site-deploy jobs
    # instead, so skip the duplicate build here. Both guards plus the
    # D-CI-Page Preview / D-Full CI label gate live in the pr-gate action's
    # web_preview output.
    if: >-
      needs.changes.outputs.build == 'true' &&
      needs.gate.outputs.preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - name: Build web bundle
        uses: ./.github/actions/build-web

  deploy-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ci-testing-web
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - name: Deploy preview to Cloudflare Pages
        uses: ./.github/actions/deploy-web-pages
        with:
          flavor: nightly
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          branch: ${{ github.head_ref }}
          commit-hash: ${{ github.event.pull_request.head.sha }}
          comment: "true"
          comment-header: web-preview

