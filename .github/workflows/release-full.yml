name: Release Full Test

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: release-full-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-release-test:
    name: App release test
    if: |
      contains(github.event.pull_request.labels.*.name, 'V-Release') &&
      contains(github.event.pull_request.labels.*.name, 'V-Test') &&
      github.repository == 'Embers-of-the-Fire/eve-fit-assistant' &&
      github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/_release.yml
    secrets: inherit
    with:
      test_mode: true

  data-release-test:
    name: Data release test
    if: |
      contains(github.event.pull_request.labels.*.name, 'V-Release') &&
      contains(github.event.pull_request.labels.*.name, 'V-Test') &&
      github.repository == 'Embers-of-the-Fire/eve-fit-assistant' &&
      github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/_release-data.yml
    secrets: inherit
    with:
      test_mode: true

  mark-tested:
    name: Mark as tested release
    needs: [app-release-test, data-release-test]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.app-release-test.result == 'success' &&
      needs.data-release-test.result == 'success'
    steps:
      - uses: actions/github-script@v7
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const labels = pr.labels.map((l) => l.name);

            if (pr.head.sha !== process.env.PR_HEAD_SHA) {
              core.info(
                `PR HEAD has moved (${pr.head.sha} vs ${process.env.PR_HEAD_SHA}); skipping label update.`
              );
              return;
            }
            if (!labels.includes('V-Release')) {
              core.info('V-Release is no longer present; skipping label update.');
              return;
            }
            if (!labels.includes('V-Test')) {
              core.info('V-Test is no longer present; skipping label update.');
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'V-Test',
              });
              core.info('Removed label V-Test');
            } catch (error) {
              const status = error.status || error.response?.status;
              if (status === 404) {
                core.info('V-Test was not present');
              } else {
                throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['V-Tested Release'],
            });
            core.info('Added label V-Tested Release');
