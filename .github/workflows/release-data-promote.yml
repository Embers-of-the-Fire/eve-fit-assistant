name: Release Data Promote

# Daily auto-promotion of soak-eligible testing snapshots into the stable
# channel. Eligibility = testing publish older than 24h, minus the stable
# channel's suppression list. An empty plan (quiet period) is a successful
# no-op; failures surface as failed runs.
#
# The cron is intentionally scheduled ~2h after the 04:00 UTC
# update-raw-data.yml chain (the normal daily snapshot update), so a typical
# snapshot is promoted ~26h after its testing publish (24h soak + up to ~2h
# cron latency). Edge case: a publish that lands after 06:07 UTC misses that
# day's run and is promoted the next day (~48h latency) — an accepted,
# intentional delay.
#
# Non-quiet promotions are announced to the QQ bot as channel="stable"
# data_update events (the testing-channel publish is announced separately by
# _release-data.yml).

permissions:
  contents: read

on:
  schedule:
    # Daily, ~2h after the 04:00 UTC update-raw-data chain; see header comment.
    - cron: "7 6 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run in test mode (against a local RustFS mock instead of the real remote)"
        type: boolean
        default: false

# Promotions move the stable head; never run two concurrently and never cancel
# one mid-publish.
concurrency:
  group: data-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote eligible snapshots to stable
    runs-on: ubuntu-latest
    environment: ${{ inputs.test_mode && 'ci-testing' || 'production-data' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Python env
        uses: $/.github/actions/setup-python-env
        with:
          init-dev-env: true

      - name: Generate protobuf
        run: nix develop .#codegen --command bash -c 'uv run x.py generate protobuf'

      - name: Start RustFS mock
        if: inputs.test_mode
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote mock launch --daemon'

      - name: Sync remote channel heads
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote sync \
              --target s3 \
              --channel testing \
              --schema-root cache/remote'
          # The stable channel may not exist remotely yet (before the first
          # promotion); tolerate a missing head so the bootstrap promotion
          # below can create it. The testing head stays strict — its absence
          # in production is a genuine error.
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              remote sync \
              --target s3 \
              --channel stable \
              --allow-missing-head \
              --schema-root cache/remote'

      # The mock starts empty on a fresh dispatch; a missing testing head means
      # there is simply nothing to promote in this smoke run.
      - name: Sync remote channel heads (RustFS mock)
        if: inputs.test_mode
        id: sync
        continue-on-error: true
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py remote sync \
              --target mock \
              --channel testing \
              --schema-root cache/remote'
          nix develop .#python --command bash -c \
            'uv run x.py remote sync \
              --target mock \
              --channel stable \
              --schema-root cache/remote'

      - name: Promote eligible snapshots
        if: inputs.test_mode == false
        env:
          REMOTE_ENDPOINT: ${{ secrets.REMOTE_STORAGE_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.REMOTE_STORAGE_BUCKET }}
          REMOTE_ACCESS_KEY: ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
          REMOTE_SECRET_KEY: ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}
        run: |
          # shellcheck disable=SC2016
          nix develop .#python --command bash -c \
            'uv run x.py \
              --dev-env remote.s3.endpoint="${REMOTE_ENDPOINT}" \
              --dev-env remote.s3.bucket="${REMOTE_BUCKET}" \
              --dev-env remote.s3.access_key="${REMOTE_ACCESS_KEY}" \
              --dev-env remote.s3.secret_key="${REMOTE_SECRET_KEY}" \
              ci release-data promote \
              --schema-root cache/remote \
              --report promote-report.json \
              --allow-missing-head \
              --target s3'

      - name: Promote eligible snapshots (RustFS mock)
        if: inputs.test_mode && steps.sync.outcome == 'success'
        run: |
          nix develop .#python --command bash -c \
            'uv run x.py ci release-data promote \
              --schema-root cache/remote \
              --report promote-report.json \
              --target mock'

      # The report drives the stable-channel QQ bot announcement in the
      # notify-qqbot job; it is written for every outcome, quiet periods
      # included (empty admitted list). The promote step may be skipped
      # entirely in test mode (empty mock), hence the hashFiles guard.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && hashFiles('promote-report.json') != ''
        with:
          name: promote-report
          path: promote-report.json
          retention-days: 1

      - name: Upload diagnostics
        if: failure()
        uses: $/.github/actions/upload-diagnostics
        with:
          name: diagnostics-data-promote
          redact-values: |
            ${{ secrets.REMOTE_STORAGE_ACCESS_KEY }}
            ${{ secrets.REMOTE_STORAGE_SECRET_KEY }}

  notify-qqbot:
    name: Announce stable promotion to QQ bot
    needs: [promote]
    runs-on: ubuntu-slim
    # Post-promotion announcement, real runs only: in test mode the promotion
    # targets the RustFS mock, so mock promotions never reach the bot. The
    # production-data environment supplies the bot's bearer secret.
    if: |
      always() &&
      needs.promote.result == 'success' &&
      inputs.test_mode == false
    environment: production-data
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promote-report
          path: .

      # Quiet period: the report is always written, with an empty admitted
      # list when nothing was promoted; skip the broadcast in that case.
      - name: Check for promoted snapshots
        id: check
        run: |
          count=$(jq '.admitted | length' promote-report.json)
          echo "Promoted snapshots: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # Event API contract (bofa-qqbot EVENT.md): bearer auth plus
      # {"type": "data_update", "payload": {channel, servers: [{id, name, build,
      # version, createdAt}]}}. channel="stable" distinguishes this promotion
      # announcement from the testing-channel publish announced by
      # _release-data.yml. Each admitted entry embeds the snapshot's
      # metadata.json content.
      - name: Post data_update event
        if: steps.check.outputs.count != '0'
        env:
          QQBOT_EVENT_SECRET: ${{ secrets.QQBOT_EVENT_SECRET }}
        run: |
          set -euo pipefail
          payload=$(jq '{type: "data_update", payload: {
            channel: "stable",
            servers: [.admitted[] | {
              id: .metadata.serverId,
              name: (.metadata.name.zh // .metadata.name.en // .metadata.serverId),
              build: (.metadata.gameBuild | tonumber),
              version: .metadata.gameVersion,
              createdAt: .metadata.createdAt
            }]
          }}' promote-report.json)
          response=$(curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST "https://bot.efa-tech.dev/event" \
            -H "Authorization: Bearer ${QQBOT_EVENT_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "QQ bot response: $response"
