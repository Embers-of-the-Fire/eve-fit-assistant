name: "错误报告"
description: "报告一个可复现的问题"
title: "[Bug]: "
labels: ["T-Bug", "V-Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交错误报告。
        请尽量完整填写以下信息，方便我们复现和排查问题。

  - type: textarea
    id: summary
    attributes:
      label: 概述
      description: 这个问题是什么？
      placeholder: 请简要清晰地描述问题。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      placeholder: 描述你原本预期会发生什么。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 描述实际发生了什么。
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android
        - iOS
        - Web
        - Windows 10/11
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 0.1.0

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图 / 其他补充
      description: 可附上日志、截图或其他有助于定位问题的信息。
      placeholder: 请在此粘贴日志或补充截图。

  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索过现有 issue，确认不是重复提交。
          required: true
        - label: 我可以在较新的版本中复现该问题。
          required: false
        - label: 我可以在较新的数据包中复现该问题。
          required: false
