name: "Bug Report"
description: "Report a reproducible problem"
title: "[Bug]: "
labels: ["T-Bug", "V-Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        Please provide enough detail for us to reproduce and investigate it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is the bug?
      placeholder: A short and clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: Describe what actually happened.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - Windows 10/11
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g. 0.1.0

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots / Extra Context
      description: Add logs, screenshots, or anything else that may help.
      placeholder: Paste logs or attach screenshots here.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before submitting this report.
          required: true
        - label: I can reproduce this issue on a recent version.
          required: false
        - label: I can reproduce this issue on a recent data bundle.
          required: false
