name: "Feature Request"
description: "Suggest an improvement or new feature"
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea.
        Please explain the user problem first, then describe the feature you want.

  - type: textarea
    id: problem
    attributes:
      label: Problem to Solve
      description: What user problem, pain point, or missing workflow does this request address?
      placeholder: Describe the problem you are trying to solve.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What behavior or feature would you like to see?
      placeholder: Describe the feature you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any workarounds or alternative approaches?
      placeholder: Describe any alternatives or leave blank.

  - type: textarea
    id: impact
    attributes:
      label: Use Case / Impact
      description: Who benefits from this and why is it important?
      placeholder: Explain the expected value of this feature.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Mockups / References / Extra Context
      placeholder: Add screenshots, references, or extra notes here.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before submitting this request.
          required: true
