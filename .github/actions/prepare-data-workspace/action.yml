name: Prepare data release workspace

description: >-
  Shared preamble for _release-data.yml's post-build jobs: check out the repo
  with submodules, install the Python toolchain and tracked dev config,
  download the snapshot artifact produced by the build job into the workspace
  root, and regenerate protobuf bindings so x.py can read the snapshot
  schemas. This action reads no secrets; jobs keep their `environment:` and
  inject credentials only into the steps that need them.

inputs:
  artifact:
    description: "Snapshot artifact name produced by the build job"
    required: false
    default: "v2-snapshots"

runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: true
        persist-credentials: false

    - name: Setup Python env
      uses: ./.github/actions/setup-python-env
      with:
        init-dev-env: true

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: .

    - name: Generate protobuf
      shell: bash
      run: nix develop .#codegen --command bash -c 'uv run x.py generate protobuf'
