name: Setup build env (Windows)

description: >-
  Windows variant of the shared platform build preamble, without Nix:
  uv/Python dependencies, Flutter, Rust toolchain and cargo cache, protoc
  with the Dart plugin (protoc-gen-dart), flutter_rust_bridge_codegen,
  dev config, backend env, native CI data, Flutter dependencies,
  code generation, and the WiX toolset.

runs:
  using: composite
  steps:
    # No python-version input: setup-uv picks up the repo's .python-version.
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: Install Python dependencies
      shell: pwsh
      run: uv sync

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: "3.47.4"
        channel: stable
        cache: true

    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1

    - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        version: ^12.0.0

    - name: Install flutter_rust_bridge_codegen
      shell: pwsh
      # Prebuilt binary via cargo-binstall; falls back to source build if no
      # artifact matches the runner.
      run: cargo binstall --no-confirm flutter_rust_bridge_codegen@2.13.0

    # Pin protoc to the version shipped by the pinned nixpkgs (protobuf 36.2)
    # so codegen output matches the Nix shells.
    - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        version: "36.2"
        repo-token: ${{ github.token }}

    # The Nix shells ship protoc-gen-dart directly; on Windows it only exists
    # as a pub-global package. Its shim lives in the pub cache bin dir, which
    # is not on PATH by default — export it for all later job steps.
    # Pin the plugin to the version built against the protobuf runtime locked
    # in pubspec.lock (protobuf 6.0.0 ↔ protoc_plugin 25.0.0); protoc_plugin
    # 25.1.0 emits code that requires protobuf 6.1.0 and breaks compilation.
    # A restored pub cache can hold a stale native `.exe` binstub from a
    # previous activation. Pub reads every file in the bin dir as UTF-8 while
    # refreshing binstubs (in both activate and deactivate) and crashes on the
    # binary ("Failed to decode data using encoding 'utf-8'") before it can
    # replace it. Delete stale non-text binstubs first; activation then
    # rewrites the remaining text shims itself, so no deactivate is needed.
    - name: Install protoc-gen-dart
      shell: pwsh
      run: | # zizmor: ignore[github-env] runner-local pub-cache bin dir; not attacker-controlled, required on PATH for later codegen steps
        $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
        $pubBin = "$pubCache\bin"
        if (Test-Path $pubBin) {
          Get-ChildItem $pubBin -Filter *.exe -File | Remove-Item -Force
        }
        dart pub global activate protoc_plugin 25.0.0
        Add-Content $env:GITHUB_PATH $pubBin

    # flutter_secure_storage_windows includes <atlstr.h>, which ships with the
    # VS C++ ATL component — not preinstalled on windows-latest images.
    - name: Ensure VS ATL component (atlstr.h)
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $atl = & $vswhere -latest -products * -find "**\atlmfc\include\atlstr.h" | Select-Object -First 1
        if (-not $atl) {
          $vsPath = & $vswhere -latest -products * -property installationPath
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" modify `
            --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.VC.ATL `
            --quiet --wait --norestart
          if ($LASTEXITCODE -ne 0) { throw "VS ATL component install failed (exit $LASTEXITCODE)" }
          $atl = & $vswhere -latest -products * -find "**\atlmfc\include\atlstr.h" | Select-Object -First 1
          if (-not $atl) { throw "atlstr.h still not found after installing VC.ATL" }
        }
        "ATL header: $atl"

    - name: Init dev env
      shell: pwsh
      run: Copy-Item ci/config/efa.dev.toml efa.dev.toml

    - name: Setup CI developer config
      shell: pwsh
      run: uv run x.py dev env write-backend

    # Same payload as the Nix action's symlink step, but Windows runners copy
    # the pb2 tree instead of symlinking it.
    - name: Fetch native CI data
      shell: pwsh
      run: |
        curl.exe -sfLo "$env:RUNNER_TEMP\ci-native-data.tar.gz" `
          https://ci.storage.efa-tech.dev/build-dependencies/ci-native-data.tar.gz
        New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\ci-native" | Out-Null
        tar -xzf "$env:RUNNER_TEMP\ci-native-data.tar.gz" -C "$env:GITHUB_WORKSPACE\ci-native"
        New-Item -ItemType Directory -Force packages/eve-fit-os/data/out | Out-Null
        Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\ci-native\pb2" packages/eve-fit-os/data/out/pb2

    - name: Install Flutter dependencies
      shell: pwsh
      run: flutter pub get

    - name: Generate all
      shell: pwsh
      run: uv run x.py generate -f all

    # WiX is pinned to v6: v7 requires accepting the OSMF EULA
    # (https://wixtoolset.org/osmf/), which we do not auto-accept in CI.
    - name: Install WiX toolset
      shell: pwsh
      run: | # zizmor: ignore[github-env] fixed runner-local dotnet tools dir; not attacker-controlled, required on PATH for later wix steps
        dotnet tool install --global wix --version 6.0.1
        # dotnet tool install does not add the global tools dir to PATH for the
        # running process; export it for this step and all later job steps.
        $toolsDir = "$env:USERPROFILE\.dotnet\tools"
        $env:PATH = "$toolsDir;$env:PATH"
        Add-Content $env:GITHUB_PATH $toolsDir
        wix extension add -g WixToolset.UI.wixext/6.0.1
