name: Web gate

description: >-
  Decide whether the Flutter web bundle must be rebuilt for a change set,
  via `uv run x.py ci web-gate`. An empty or unfetchable target yields
  build=true: deploy rather than risk a stale bundle. This action reads no
  secrets; it only needs a checked-out repo with enough git history, so it
  is safe to use under any job `environment:`.

inputs:
  target:
    description: "Base commit-ish to diff against. Empty or unfetchable means build=true."
    required: false
    default: ""
  head:
    description: "Head commit-ish to diff against."
    required: false
    default: HEAD
  fetch:
    description: >-
      Fetch the target/head tips from origin first. Needed for PR merge-ref
      checkouts, where the base/head tips may not be ancestors of the merge
      ref (e.g. when the base branch advanced).
    required: false
    default: "false"

outputs:
  build:
    description: "'true' if the web bundle must be rebuilt (or the target is unknown)."
    value: ${{ steps.gate.outputs.build }}

runs:
  using: composite
  steps:
    # The gate step can exit before `uv run` ever executes (unknown target),
    # leaving no cache directory for the post-job prune to clean up. Caching
    # gains nothing for this single lightweight `uv run` anyway.
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        python-version: "3.13"
        enable-cache: false

    - name: Resolve web gate
      id: gate
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        HEAD: ${{ inputs.head }}
        FETCH: ${{ inputs.fetch }}
      run: |
        if [[ "$FETCH" == "true" && -n "$TARGET" ]]; then
          if ! git fetch --no-tags origin "$TARGET" "$HEAD"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        if [[ -z "$TARGET" ]] || ! git cat-file -e "$TARGET^{commit}" 2>/dev/null; then
          echo "build=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        BUILD=$(uv run x.py ci web-gate --target "$TARGET" --head "$HEAD")
        echo "build=$BUILD" >> "$GITHUB_OUTPUT"
