syntax = "proto2";
package efa.v2;

/// Describes a single release with per-platform artifact metadata.
message ReleaseIndex {
  required int32 schema_version = 1;
  required string id = 2;
  required string version = 3;
  optional AndroidArtifacts android = 4;
}

message AndroidArtifactVariant {
  required string identifier = 1;
  required string content_hash = 2;
  required int64 size = 3;
}

message AndroidArtifacts {
  required AndroidArtifactVariant general = 1;
  optional AndroidArtifactVariant armv7 = 2;
  optional AndroidArtifactVariant arm64 = 3;
  optional AndroidArtifactVariant x64 = 4;
}
