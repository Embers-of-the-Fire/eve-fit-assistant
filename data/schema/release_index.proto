syntax = "proto2";
package efa.v2;

/// Lists all known releases.
message ReleaseIndex {
  required int32 schema_version = 1;
  repeated Entry entries = 2;

  message Entry {
    required string id = 1;              // Unique release identifier
    required string version = 2;         // Semver string
    repeated string offerings = 3;       // Platform offerings (android, windows, etc.)
    required string ident_hash = 4;      // SHA-256 hex of release:// URI
  }
}
