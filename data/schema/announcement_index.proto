syntax = "proto2";
package efa.v2;

/// Lists all announcements with their content hashes and version constraints.
message AnnouncementIndex {
  required int32 schema_version = 1;
  repeated Entry entries = 2;

  message Entry {
    required string id = 1;                          // Unique announcement identifier
    required string first_published_at = 2;          // ISO 8601
    required string updated_at = 3;                  // ISO 8601
    map<string, string> content_hashes = 4;          // locale -> SHA-256 hex of blob content
    optional string version_min = 5;                 // Semver lower bound
    optional string version_max = 6;                 // Semver upper bound
    optional bool is_version_update = 7;             // Marks version-bump notifications
  }
}
