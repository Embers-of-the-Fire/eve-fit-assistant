syntax = "proto2";
package efa.v2;

/// Complete server catalog at the time of a generation.
message ServerIndex {
  required int32 schema_version = 1;
  repeated Entry servers = 2;

  message Entry {
    required string server_id = 1;
    map<string, string> name = 2;     // locale -> display name
    required string game_build = 3;
    required string game_version = 4;
  }
}
