name: efa
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - apps/eve-fit-assistant
  - packages/acl/dart
  - packages/efa_compat
  - packages/efa_component
  - packages/efa_constant
  - packages/efa_fit
  - packages/efa_fit_snapshot
  - packages/efa_platform_client
  - packages/efa_proto

dev_dependencies:
  melos: ^8.3.0

melos:
  repository: https://github.com/Embers-of-the-Fire/eve-fit-assistant

  bootstrap:
    environment:
      sdk: ^3.12.2
      flutter: ^3.44.4

    dependencies:
      dio: ^5.11.0
      fpdart: ^1.2.0
      flutter_rust_bridge: 2.13.0-beta.6

      canonical_json: ^1.1.3
      crypto: ^3.0.7

      freezed_annotation: ^3.1.0
      json_annotation: ^4.12.0
      protobuf: ^6.0.0

      intl: ^0.20.2

    dev_dependencies:
      mocktail: ^1.0.4

  # Flutter-app-scoped tasks. All of them execute inside apps/eve-fit-assistant
  # (scoped via packageFilters); extra CLI arguments can be appended after `--`,
  # e.g. `melos run app:test -- --platform chrome`.
  scripts:
    app:test:
      description: Run the app's Flutter test suite on the VM.
      exec: flutter test
      packageFilters:
        scope: eve_fit_assistant
    app:analyze:
      description: Statically analyze the app's Dart code.
      steps:
        - pkg:l10n
        - app:analyze:exec
    app:analyze:exec:
      private: true
      exec: dart analyze
      packageFilters:
        scope:
          - eve_fit_assistant
          - acl
          - efa_compat
          - efa_component
          - efa_constant
          - efa_fit
          - efa_fit_snapshot
          - efa_platform_client
    app:fix:
      description: Apply automated Dart fixes to the app.
      exec: dart fix --apply
      packageFilters:
        scope:
          - eve_fit_assistant
          - acl
          - efa_compat
          - efa_component
          - efa_constant
          - efa_fit
          - efa_fit_snapshot
          - efa_platform_client
    app:format:
      description: Format the app's Dart sources.
      exec: dart format lib
      packageFilters:
        scope:
          - eve_fit_assistant
          - acl
          - efa_compat
          - efa_component
          - efa_constant
          - efa_fit
          - efa_fit_snapshot
          - efa_platform_client
    app:format:check:
      description: Verify the app's Dart sources are formatted.
      exec: dart format --set-exit-if-changed lib
      packageFilters:
        scope:
          - eve_fit_assistant
          - acl
          - efa_compat
          - efa_component
          - efa_constant
          - efa_fit
          - efa_fit_snapshot
          - efa_platform_client
    app:gen:
      description: Run the app's build_runner code generation.
      exec: flutter pub run build_runner build --delete-conflicting-outputs
      packageFilters:
        scope: eve_fit_assistant
    pkg:test:
      description: Run the packages' test suites.
      steps:
        - pkg:l10n
        - acl:gen
        - pkg:test:exec
    acl:gen:
      description: Generate the ACL package's test fixtures from the example schema.
      exec: pnpm --filter acl-tool generate:fixtures
    pkg:test:exec:
      private: true
      exec: flutter test
      packageFilters:
        scope:
          - acl
          - efa_fit
          - efa_component
          - efa_fit_snapshot
          - efa_platform_client
    pkg:l10n:
      description: Generate the snapshot package's localization files.
      exec: flutter gen-l10n
      packageFilters:
        scope: efa_fit_snapshot
    app:gen:watch:
      description: Run the app's build_runner code generation in watch mode.
      exec: flutter pub run build_runner watch --delete-conflicting-outputs
      packageFilters:
        scope: eve_fit_assistant
    app:l10n:
      description: Generate the app's localization files.
      exec: flutter gen-l10n
      packageFilters:
        scope: eve_fit_assistant
    app:clean:
      description: Clean the app's Flutter build artifacts.
      exec: flutter clean
      packageFilters:
        scope: eve_fit_assistant
    app:build:apk:
      description: Build the app's Android APK(s).
      exec: flutter build apk
      packageFilters:
        scope: eve_fit_assistant
    app:build:web:
      description: Build the app's self-contained wasm web bundle.
      exec: flutter build web --wasm --no-web-resources-cdn
      packageFilters:
        scope: eve_fit_assistant
    app:build:linux:
      description: Build the app's Linux release bundle.
      exec: flutter build linux --release
      packageFilters:
        scope: eve_fit_assistant
    app:build:windows:
      description: Build the app's Windows release bundle.
      exec: flutter build windows --release
      packageFilters:
        scope: eve_fit_assistant
