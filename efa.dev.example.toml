# EFA local developer configuration example
# This file is for local paths, private settings, and developer shortcuts.
# Copy this file to `efa.dev.toml` and adjust values for your machine.
# The real `efa.dev.toml` is ignored by Git and should not be checked in.

[paths]
# `root` is the parent directory for local mutable project state.
# Relative paths are resolved against the project root.
# The subdirectory layout is fixed:
# - `log` stores Python logs.
# - `workspaces/<workspace>` stores per-workspace cache files.
# - `workspaces/<workspace>/generated` stores generated bundle content.
# - `workspaces/<workspace>/output` stores built bundle archives.
root = "cache"

[workspace]
# Default workspace used by `./x` when `.efa.cache` has no saved default.
default = "tranquility"

[build]
# Shortcut default for `./x build data --no-hash`.
skip_hash = false

# Shortcut default for `./x build increment <baseline>`.
baseline = "cache/workspaces/tranquility/output/bundle_manifest.json"

[native]
# Settings used to generate the backend `.env` file for local Rust tooling.
fsd_format = "msgpack"
fsd_binary_dir = "data/resources/tranquility/fsd"
fsd_loc_en_dir = "cache/workspaces/tranquility/index-cache/resources/localizationfsd/localization_fsd_en-us.pickle"
output_dir = "cache/workspaces/tranquility/native"

[remote]
# Settings used by `./x remote` to materialize and launch local remote mocks
# and publish content to S3-compatible storage.
resource_root = "efa/v1"
channel = "testing"

# Common mock host for both MinIO and static mocks.
host = "127.0.0.1"

# Paths are resolved relative to [paths].root unless absolute.
mock_origin_dir = "remote/mock-origin"
# verify_upload = true  # optional global override (overrides sub-target defaults)
# verify_workers = 4   # optional global override for concurrent download workers

[remote.minio]
# MinIO mock server defaults. All fields are required — no silent defaults.
# These credentials are for local development only.
port = 9000
console_port = 9001
bucket = "efa-dev"
access_key = "minioadmin"
secret_key = "minioadmin"
data_dir = "remote/minio-data"
alias = "efa-remote-mock"
public_download = true
# verify_upload = false  # default: false; re-download and SHA256-verify after upload
# verify_workers = 4     # default: 4; concurrent download threads for verification

[remote.s3]
# S3-compatible publishing defaults. All fields are required.
# Used by `./x remote publish upload --target s3`.
endpoint = "https://s3.example.com"
bucket = "efa-publish"
access_key = "your-access-key"
secret_key = "your-secret-key"
alias = "efa-remote-publish"
public_download = true
# verify_upload = true  # default: true; re-download and SHA256-verify after upload
# verify_workers = 4    # default: 4; concurrent download threads for verification

[ci.storage]
# Cloudflare R2 bucket for CI build dependencies (e.g. native data tarball).
# Used by `./x ci pack-data` to reference the upload destination.
# The bucket should be publicly readable; the CI workflow fetches via public_url.
endpoint = "https://<account_id>.r2.cloudflarestorage.com"
bucket = "efa-ci-data"
alias = "efa-ci-storage"
access_key = "your-r2-access-key"
secret_key = "your-r2-secret-key"
public_url = "https://ci.storage.efa-tech.dev"
