# EFA local developer configuration example
# This file is for local paths, private settings, and developer shortcuts.
# Copy this file to `efa.dev.toml` and adjust values for your machine.
# The real `efa.dev.toml` is ignored by Git and should not be checked in.

[paths]
# `root` is the parent directory for local mutable project state.
# Relative paths are resolved against the project root.
# The subdirectory layout is fixed:
# - `log` stores Python logs.
# - `workspaces/<workspace>` stores per-workspace cache files.
# - `workspaces/<workspace>/generated` stores generated bundle content.
# - `workspaces/<workspace>/output` stores built bundle archives.
root = "cache"

[workspace]
# Default workspace used by `./x` when `.efa.cache` has no saved default.
default = "tranquility"

[build]
# Shortcut default for `./x build data --no-hash`.
skip_hash = false

# Shortcut default for `./x build increment <baseline>`.
baseline = "cache/workspaces/tranquility/output/bundle_manifest.json"

[native]
# Settings used to generate the backend `.env` file for local Rust tooling.
fsd_format = "msgpack"
fsd_binary_dir = "data/resources/tranquility/fsd"
fsd_loc_en_dir = "cache/workspaces/tranquility/index-cache/resources/localizationfsd/localization_fsd_en-us.pickle"
output_dir = "cache/workspaces/tranquility/native"

[remote]
# Settings used by `./x remote` to materialize and launch local remote mocks.
resource_root = "efa/v1"
channel = "alpha"

# Static HTTP mock defaults.
host = "127.0.0.1"
static_port = 8765

# MinIO mock defaults. These credentials are for local development only.
minio_port = 9000
minio_console_port = 9001
minio_bucket = "efa-dev"
minio_access_key = "minioadmin"
minio_secret_key = "minioadmin"

# Paths are resolved relative to [paths].root unless absolute.
mock_origin_dir = "remote/mock-origin"
minio_data_dir = "remote/minio-data"
