org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Disable Flutter's per-ABI versionCode offset for --split-per-abi builds
# (armv7=1xxx, arm64=2xxx, x64=4xxx). With direct APK distribution every
# variant must carry the raw build number so the release index's `build`
# matches the installed versionCode and cross-variant installs never count
# as downgrades.
force-version-code-ignoring-abi=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
