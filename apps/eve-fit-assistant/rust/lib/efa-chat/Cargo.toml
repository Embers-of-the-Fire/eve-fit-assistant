[package]
name = "efa-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
rig = "0.41"
futures = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eve-fit-os = { path = "../../../../../packages/eve-fit-os" }
log = "0.4"
web-time = "1"
# Direct dependency for building proxy-configured clients; the feature set
# (TLS etc.) is unified with rig's own reqwest requirement.
reqwest = { version = "0.13", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
dotenvy = "0.15"
serde_json = "1"

# Test-only tokio features for the proxy redirect integration test
# (`macros` for #[tokio::test], `net`/`io-util` for the stub servers).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util"] }
