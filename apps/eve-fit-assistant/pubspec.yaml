name: eve_fit_assistant
description: "EVE Fit Assistant"
publish_to: none
resolution: workspace

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.10.0+23

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  rust_lib_eve_fit_assistant:
    path: rust_builder
  efa_compat:
    path: ../../packages/efa_compat
  efa_constant:
    path: ../../packages/efa_constant
  efa_proto:
    path: ../../packages/efa_proto

  animated_text_kit: ^4.3.0
  animated_tree_view: ^2.3.0
  archive: ^4.0.7
  auto_route: ^11.1.0
  canonical_json: ^1.1.3
  convert: ^3.1.2
  crypto: ^3.0.7
  date_format: ^2.0.9
  dio: ^5.11.0
  dio_cache_interceptor: ^4.0.7
  fast_immutable_collections: ^11.1.0
  ffi: ^2.2.0
  file: ^7.0.1
  file_picker: ^12.0.0-beta.7
  flutter_breadcrumb: ^1.0.1
  flutter_easyloading: ^4.0.2
  flutter_launcher_icons: ^0.14.4
  flutter_markdown_plus: ^1.0.12
  flutter_native_splash: ^2.4.8
  flutter_rust_bridge: 2.13.0-beta.6
  flutter_secure_storage: ^11.0.0
  fluttertoast: ^10.0.0
  font_awesome_flutter: ^11.0.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  hive_ce: ^2.18.0
  http_cache_hive_store: ^5.1.1
  html: ^0.15.6
  intl: ^0.20.2
  json_annotation: ^4.12.0
  loading_indicator: ^3.1.1
  logger: ^2.6.2
  path: ^1.9.1
  path_provider: ^2.1.6
  protobuf: ^6.0.0
  riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  shared_preferences: ^2.5.4
  share_plus: ^13.3.0
  toggle_switch: ^2.3.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web: ^1.1.1
  flutter_slidable: ^4.0.3
  yaml: ^3.1.3
  package_info_plus: ^10.2.1
  restart_app: ^1.3.2
  sqlite3: ^3.5.0
  sqlite3_web: ^0.9.4
  sqlite_async: ^0.14.4
  flutter_local_notifications: ^22.3.0
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  auto_route_generator: ^10.6.0
  build_runner: ^2.15.1
  # custom_lint: ^0.8.1 # Incompatible with flutter_lints
  flutter_lints: ^6.0.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8
  mocktail: ^1.0.4

# riverpod depends on `test`, and the test versions compatible with the
# flutter_test-pinned test_api 0.7.11 cap analyzer <13; the codegen toolchain
# (freezed 4.0.0-dev, riverpod_generator 4.0.8, riverpod_lint 3.1.8,
# auto_route_generator 10.6.0) requires analyzer ^13.0.0. Pin analyzer 13.0.0
# (13.2.0+ needs meta ^1.18.3 while flutter_test pins meta 1.18.0).
dependency_overrides:
  analyzer: 13.0.0
  # dart_style 3.1.10+ requires analyzer >=13.1.0; 3.1.9 is the last release
  # compatible with the pinned analyzer 13.0.0.
  dart_style: 3.1.9
  # mockito 5.8.x requires analyzer >=13.3.0; 5.7.0 is the last release
  # compatible with the pinned analyzer 13.0.0.
  mockito: 5.7.0
  # flutter_launcher_icons uses an outdated version of cli_util
  # This should be removed once the upstream updates itself.
  cli_util: 0.5.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/icons/
    - assets/content/announcements/generated/catalog.json
    - assets/content/announcements/generated/documents/
    - assets/content/manual/generated/manual.pb
    - assets/content/manual/generated/manual_search.db
    - assets/content/manual/generated/content/
    - logo/
