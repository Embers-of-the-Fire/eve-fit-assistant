[package]
name = "efa-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
rig = "0.41"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
futures = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eve-fit-os = { path = "../eve-fit-os" }
log = "0.4"

[dev-dependencies]
dotenvy = "0.15"
serde_json = "1"
